<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar-bg: #0f1117;
    --sidebar-width: 230px;
    --content-bg: #f5f6f8;
    --card-bg: #ffffff;
    --border: #e8eaed;
    --text: #1a1d23;
    --text-sub: #6b7280;
    --text-dim: #9ca3af;
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --green: #059669;
    --green-light: #ecfdf5;
    --amber: #d97706;
    --amber-light: #fffbeb;
    --red: #dc2626;
    --red-light: #fef2f2;
    --purple: #7c3aed;
    --purple-light: #f5f3ff;
    --sidebar-text: #94a3b8;
    --sidebar-active: #ffffff;
    --sidebar-hover: #1e2330;
    --sidebar-active-bg: #1e2330;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Geist', sans-serif; background: var(--content-bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; font-size: 14px; }

  /* ── SIDEBAR ── */
  .sidebar { width: var(--sidebar-width); background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid #1a1f2e; }
  .sidebar-logo { padding: 20px 18px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1a1f2e; }
  .logo-icon { width: 30px; height: 30px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: white; letter-spacing: -1px; flex-shrink: 0; }
  .logo-text { font-size: 15px; font-weight: 700; color: white; letter-spacing: -0.3px; }
  .logo-sub { font-size: 10px; color: #4a5568; font-weight: 400; margin-top: 1px; }

  /* Workspace selector */
  .workspace-section { padding: 12px 14px 8px; }
  .workspace-label { font-size: 9px; font-weight: 600; color: #4a5568; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; padding-left: 4px; }
  .workspace-btn { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; cursor: pointer; margin-bottom: 2px; transition: background 0.15s; border: none; background: none; width: 100%; text-align: left; color: var(--sidebar-text); font-family: inherit; font-size: 13px; }
  .workspace-btn:hover { background: var(--sidebar-hover); color: var(--sidebar-active); }
  .workspace-btn.active { background: var(--sidebar-active-bg); color: white; }
  .workspace-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .workspace-add { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; cursor: pointer; color: #4a5568; font-size: 12px; transition: all 0.15s; border: 1px dashed #2a3040; background: none; width: 100%; margin-top: 4px; font-family: inherit; }
  .workspace-add:hover { border-color: var(--accent); color: var(--accent); }

  /* Nav */
  .nav-section { padding: 8px 14px; flex: 1; overflow-y: auto; }
  .nav-section-label { font-size: 9px; font-weight: 600; color: #4a5568; text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 4px 4px; }
  .nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 7px; cursor: pointer; transition: background 0.15s; margin-bottom: 1px; color: var(--sidebar-text); font-size: 13px; font-weight: 400; border: none; background: none; width: 100%; text-align: left; font-family: inherit; }
  .nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-active); }
  .nav-item.active { background: var(--sidebar-active-bg); color: white; font-weight: 500; }
  .nav-item svg { flex-shrink: 0; opacity: 0.7; }
  .nav-item.active svg { opacity: 1; }
  .nav-badge { margin-left: auto; background: var(--red); color: white; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center; }
  .nav-badge.amber { background: var(--amber); }
  .nav-badge.blue { background: var(--accent); }

  .sidebar-bottom { padding: 12px 14px; border-top: 1px solid #1a1f2e; }
  .user-row { display: flex; align-items: center; gap: 9px; padding: 6px 0; }
  .user-avatar { width: 28px; height: 28px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: white; flex-shrink: 0; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 12px; font-weight: 500; color: white; }
  .user-role { font-size: 10px; color: #4a5568; }

  /* ── MAIN CONTENT ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .topbar-title { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
  .topbar-sub { font-size: 12px; color: var(--text-sub); margin-top: 1px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .btn-primary { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; transition: background 0.15s; display: flex; align-items: center; gap: 6px; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-ghost { background: none; border: 1px solid var(--border); color: var(--text-sub); border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .content { flex: 1; overflow-y: auto; padding: 24px; }

  /* ── CARDS ── */
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .card-sm { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }

  /* ── STAT CARDS ── */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); display: flex; align-items: flex-start; justify-content: space-between; }
  .stat-label { font-size: 12px; color: var(--text-sub); font-weight: 500; margin-bottom: 8px; }
  .stat-num { font-size: 28px; font-weight: 700; color: var(--text); letter-spacing: -1px; line-height: 1; }
  .stat-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .stat-icon { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }

  /* ── GRID LAYOUTS ── */
  .two-col { display: grid; grid-template-columns: 1fr 380px; gap: 18px; }
  .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

  /* ── SECTION HEADERS ── */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .view-all { font-size: 12px; color: var(--accent); cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 3px; border: none; background: none; font-family: inherit; }
  .view-all:hover { text-decoration: underline; }

  /* ── STATUS TAGS ── */
  .tag { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .tag-green { background: var(--green-light); color: var(--green); }
  .tag-amber { background: var(--amber-light); color: var(--amber); }
  .tag-red { background: var(--red-light); color: var(--red); }
  .tag-blue { background: var(--accent-light); color: var(--accent); }
  .tag-purple { background: var(--purple-light); color: var(--purple); }
  .tag-gray { background: #f3f4f6; color: #6b7280; }

  /* ── PROJECT ROWS ── */
  .project-row { padding: 13px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.1s; }
  .project-row:last-child { border-bottom: none; padding-bottom: 0; }
  .project-row:first-child { padding-top: 0; }
  .project-row:hover { background: #fafbfc; margin: 0 -16px; padding-left: 16px; padding-right: 16px; border-radius: 6px; }
  .project-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .project-name { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; min-width: 0; }
  .project-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .project-next { font-size: 11px; color: var(--accent); margin-top: 3px; font-weight: 500; }
  .overview-table { width: 100%; border-collapse: collapse; }
  .overview-table th { font-size: 10px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: .7px; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); background: #fafbfc; }
  .overview-table td { padding: 14px 12px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 13px; }
  .overview-table tr:last-child td { border-bottom: none; }
  .overview-table tr:hover td { background: #fafbfc; }
  .overview-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .overview-sub { font-size: 11px; color: var(--text-dim); }
  .overview-where { font-size: 12px; color: var(--text-sub); line-height: 1.45; max-width: 360px; }
  .overview-next { font-size: 12px; color: var(--accent); font-weight: 500; line-height: 1.4; max-width: 260px; }
  .mini-meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  /* ── ACTION ROWS ── */
  .action-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .action-row:last-child { border-bottom: none; padding-bottom: 0; }
  .action-row:first-child { padding-top: 0; }
  .action-icon { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .action-title { font-size: 13px; font-weight: 500; color: var(--text); }
  .action-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* ── ROUTINE ROWS ── */
  .routine-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .routine-row:last-child { border-bottom: none; padding-bottom: 0; }
  .routine-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--green); background: var(--green-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10px; color: var(--green); cursor: pointer; transition: all 0.15s; }
  .routine-check.done { background: var(--green); color: white; }
  .routine-check.pending { border-color: var(--border); background: white; color: transparent; }
  .routine-name { font-size: 13px; color: var(--text); flex: 1; }
  .routine-name.done { text-decoration: line-through; color: var(--text-dim); }
  .routine-who { font-size: 11px; color: var(--text-dim); }

  /* ── MODAL ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; display: none; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 14px; width: 520px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 15px; font-weight: 600; }
  .modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-dim); line-height: 1; padding: 2px 6px; border-radius: 4px; }
  .modal-close:hover { background: var(--border); color: var(--text); }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 11px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
  .form-input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: inherit; outline: none; color: var(--text); transition: border-color 0.15s; }
  .form-input:focus { border-color: var(--accent); }
  .form-select { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: inherit; outline: none; color: var(--text); background: white; cursor: pointer; }
  .form-textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: inherit; outline: none; color: var(--text); resize: vertical; min-height: 70px; }

  /* ── STATUS SELECTOR ── */
  .status-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .status-pill { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.15s; background: white; font-family: inherit; }
  .status-pill.selected-green { background: var(--green-light); border-color: var(--green); color: var(--green); }
  .status-pill.selected-amber { background: var(--amber-light); border-color: var(--amber); color: var(--amber); }
  .status-pill.selected-red { background: var(--red-light); border-color: var(--red); color: var(--red); }
  .status-pill.selected-gray { background: #f3f4f6; border-color: #9ca3af; color: #6b7280; }

  /* ── PROJECT DETAIL ── */
  .detail-header { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .detail-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 10px; }
  .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .detail-field label { font-size: 10px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
  .detail-field span { font-size: 13px; color: var(--text); font-weight: 500; }
  .derived-box { background: var(--accent-light); border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px 14px; margin-top: 14px; }
  .derived-label { font-size: 10px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .derived-text { font-size: 13px; color: #1e40af; line-height: 1.5; }
  .next-action-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px 14px; margin-top: 10px; }
  .next-action-label { font-size: 10px; font-weight: 600; color: var(--green); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .next-action-text { font-size: 13px; color: #065f46; font-weight: 500; }

  /* ── TABS ── */
  .tabs { display: flex; gap: 0; background: white; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; padding: 4px; box-shadow: var(--shadow); }
  .tab { padding: 7px 16px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-sub); border: none; background: none; font-family: inherit; transition: all 0.15s; }
  .tab.active { background: var(--accent); color: white; }
  .tab:hover:not(.active) { background: var(--content-bg); color: var(--text); }

  /* ── UPDATE FEED ── */
  .update-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .update-item:last-child { border-bottom: none; }
  .update-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .update-text { font-size: 13px; color: var(--text); line-height: 1.5; }
  .update-next { font-size: 12px; color: var(--accent); margin-top: 4px; font-weight: 500; }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 40px 20px; color: var(--text-dim); }
  .empty-icon { font-size: 32px; margin-bottom: 10px; }
  .empty-text { font-size: 13px; }

  /* ── NOTIFICATION ── */
  .notif { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: white; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 200; transform: translateY(60px); opacity: 0; transition: all 0.3s; box-shadow: var(--shadow-md); }
  .notif.show { transform: translateY(0); opacity: 1; }

  /* ── WORKSPACE BADGE ── */
  .ws-badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }

  /* ── BACK BTN ── */
  .back-btn { display: flex; align-items: center; gap: 6px; color: var(--text-sub); font-size: 13px; cursor: pointer; border: none; background: none; font-family: inherit; margin-bottom: 16px; padding: 0; }
  .back-btn:hover { color: var(--accent); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar" style="display:none">
  <div class="sidebar-logo">
    <div class="logo-icon">FL</div>
    <div>
      <div class="logo-text">FLOW</div>
      <div class="logo-sub">Workspace OS</div>
    </div>
  </div>

  <div class="workspace-section">
    <div class="workspace-label">Workspaces</div>
    <div id="workspace-list"></div>
    <button class="workspace-add" onclick="openAddWorkspace()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Add workspace
    </button>
  </div>

  <div class="nav-section">
    <div class="nav-section-label">Navigate</div>
    <button class="nav-item active" id="nav-mywork" onclick="setView('mywork')">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M1 3h13M1 7.5h9M1 12h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      My Work
      <span class="nav-badge red" id="badge-issues" style="display:none">0</span>
    </button>
    <button class="nav-item" id="nav-projects" onclick="setView('projects')">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 4a1 1 0 011-1h3l1.5 2H12a1 1 0 011 1v6a1 1 0 01-1 1H3a1 1 0 01-1-1V4z" stroke="currentColor" stroke-width="1.3"/></svg>
      Projects
      <span class="nav-badge blue" id="badge-projects">0</span>
    </button>
    <button class="nav-item" id="nav-routine" onclick="setView('routine')">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 1.5A6 6 0 117.5 13.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7.5 1.5L5.5 3.5l2 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Routine
    </button>
    <button class="nav-item" id="nav-dashboard" onclick="setView('dashboard')">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1" y="1" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="1" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="9" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.3"/></svg>
      Dashboard
    </button>
    <button class="nav-item" id="nav-inbox" onclick="setView('inbox')">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M1 10l3-6h7l3 6H1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M1 10v2a1 1 0 001 1h11a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.3"/></svg>
      Inbox <span class="nav-badge red" id="badge-inbox-nav" style="display:none">0</span>
    </button>
    <button class="nav-item" id="nav-alltasks" onclick="setView('alltasks')" style="display:none">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1" y="2" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M4 6h7M4 9h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      All Tasks
    </button>
    <button class="nav-item" id="nav-allactions" onclick="setView('allactions')" style="display:none">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 7.5L6 11l7-7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      All Actions
    </button>
    <button class="nav-item" id="nav-admin" onclick="setView('admin')" style="display:none">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="5" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M2 13c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      Users
      <span class="nav-badge blue" id="badge-users" style="display:none">0</span>
    </button>
  </div>

  <div class="sidebar-bottom">

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDfpZzTSU9kiHOr709ltXRanayRGsNJrh0",
  authDomain: "flow-app-projects.firebaseapp.com",
  projectId: "flow-app-projects",
  storageBucket: "flow-app-projects.firebasestorage.app",
  messagingSenderId: "650448557312",
  appId: "1:650448557312:web:e2faec9aba52d252fa4fe5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let unsubscribeSnapshot = null;

const defaultData = {
  workspaces: [
    { id: 'w1', name: 'Work', color: '#2563eb' },
    { id: 'w2', name: 'Community', color: '#059669' },
    { id: 'w3', name: 'Home', color: '#7c3aed' },
  ],

  inbox: [],

  routines: [],
};

// Save to Firestore (shared doc for whole team)
async function saveData() {
  if (!currentUser) return;
  try {
    await setDoc(doc(db, 'flow', 'shared'), {
      ...data,
      _lastSaved: new Date().toISOString(),
      _savedBy: currentUser.email
    });
  } catch(e) {
    console.error('Save error:', e);
  }
}

// Debounced save — don't hammer Firestore on every render
let saveTimer = null;
window.scheduleSave = function() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 800);
};

// Start listening to shared Firestore doc
function startSync() {
  if (unsubscribeSnapshot) unsubscribeSnapshot();
  unsubscribeSnapshot = onSnapshot(doc(db, 'flow', 'shared'), (snap) => {
    if (snap.exists()) {
      const d = snap.data();
      // Only update if change came from someone else (avoid echo loops)
      if (d._savedBy !== currentUser.email || !window._localSave) {
        Object.assign(data, d);
        ensureProjectDefaults();
        try { render(); } catch(e) {}
      }
      window._localSave = false;
    }
  });
}

// ── PERMISSIONS ───────────────────────────────────────────────────────────────
const SUPER_ADMIN = 'izzygreenfeld@gmail.com';
window.isAdmin = false;

function isCurrentUserAdmin() {
  if (!currentUser) return false;
  if (currentUser.email === SUPER_ADMIN) return true;
  const users = data._users || {};
  return !!(users[emailKey(currentUser.email)]?.isAdmin);
}

function emailKey(email) {
  return email.replace(/\./g, '_').replace(/@/g, '__at__');
}

// Filter projects based on permissions
function visibleProjects() {
  if (window.isAdmin) return data.projects || [];
  return (data.projects || []).filter(p => !p.adminOnly);
}

// Record user in _users map when they sign in
async function recordUser(user) {
  const key = emailKey(user.email);
  const users = data._users || {};
  users[key] = {
    email: user.email,
    name: user.displayName || user.email,
    lastSeen: new Date().toISOString(),
    isAdmin: users[key]?.isAdmin || (user.email === SUPER_ADMIN),
    uid: user.uid
  };
  data._users = users;
  await setDoc(doc(db, 'flow', 'shared'), { ...data, _lastSaved: new Date().toISOString(), _savedBy: user.email });
}

// Toggle admin status
window.toggleUserAdmin = async function(emailK) {
  if (!window.isAdmin) return;
  const users = data._users || {};
  if (!users[emailK]) return;
  if (users[emailK].email === SUPER_ADMIN) { alert("Can't change super admin"); return; }
  users[emailK].isAdmin = !users[emailK].isAdmin;
  data._users = users;
  window._localSave = true;
  await setDoc(doc(db, 'flow', 'shared'), { ...data, _lastSaved: new Date().toISOString(), _savedBy: currentUser.email });
  notify(users[emailK].isAdmin ? 'Promoted to admin' : 'Removed admin access');
  renderAdminPanel();
};

// Auth flow
window.signInWithGoogle = async function() {
  const provider = new GoogleAuthProvider();
  try {
    await signInWithPopup(auth, provider);
  } catch(e) {
    document.getElementById('login-error').textContent = 'Sign-in failed: ' + e.message;
    document.getElementById('login-error').style.display = 'block';
  }
};

window.signOutUser = async function() {
  if (unsubscribeSnapshot) unsubscribeSnapshot();
  await signOut(auth);
};

onAuthStateChanged(auth, async (user) => {
  const loginScreen = document.getElementById('login-screen');
  const loadingScreen = document.getElementById('loading-screen');
  const sidebar = document.querySelector('.sidebar');
  const main = document.querySelector('.main');
  const fab = document.getElementById('fab-btn');

  if (user) {
    currentUser = user;
    window.currentUser = user;

    // Load existing data or create default
    const snap = await getDoc(doc(db, 'flow', 'shared'));
    if (snap.exists()) {
      Object.assign(data, snap.data());
    } else {
      await setDoc(doc(db, 'flow', 'shared'), { ...defaultData, _created: new Date().toISOString() });
    }

    // Record this user's sign-in
    await recordUser(user);

    // Set admin flag
    window.isAdmin = isCurrentUserAdmin();

    // Update sidebar user info
    const initials = user.displayName ? user.displayName.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase() : user.email.slice(0,2).toUpperCase();
    const avatarEl = document.querySelector('.user-avatar');
    const nameEl = document.querySelector('.user-name');
    const roleEl = document.querySelector('.user-role');
    if (avatarEl) avatarEl.textContent = initials;
    if (nameEl) nameEl.textContent = user.displayName || user.email;
    if (roleEl) roleEl.innerHTML = (window.isAdmin ? '<span style="color:#f59e0b;font-weight:600">Admin</span> · ' : '') + user.email + ' &nbsp;<button onclick="signOutUser()" style="background:none;border:none;color:#4a5568;cursor:pointer;font-size:10px;font-family:inherit;padding:0">Sign out</button>';

    // Show admin nav item if admin
    const adminNav = document.getElementById('nav-admin');
    if (adminNav) adminNav.style.display = window.isAdmin ? 'flex' : 'none';
    var elAT=document.getElementById('nav-alltasks'); if(elAT) elAT.style.display=window.isAdmin?'flex':'none';
    var elAA=document.getElementById('nav-allactions'); if(elAA) elAA.style.display=window.isAdmin?'flex':'none';

    ensureProjectDefaults();
    startSync();

    if (loginScreen) loginScreen.style.display = 'none';
    if (loadingScreen) loadingScreen.style.display = 'none';
    if (sidebar) sidebar.style.display = 'flex';
    if (main) main.style.display = 'flex';
    if (fab) fab.style.display = window.isAdmin ? 'block' : 'none';

    setView('mywork');
  } else {
    currentUser = null;
    window.currentUser = null;
    window.isAdmin = false;
    if (loadingScreen) loadingScreen.style.display = 'none';
    if (loginScreen) loginScreen.style.display = 'flex';
    if (sidebar) sidebar.style.display = 'none';
    if (main) main.style.display = 'none';
    if (fab) fab.style.display = 'none';
  }
});
</script>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const WS_COLORS = ['#2563eb','#059669','#7c3aed','#d97706','#dc2626','#0891b2'];

// ── USER HELPERS ──────────────────────────────────────────────────────────────

// ── AUDIT LOG ──────────────────────────────────────────────────────────────────
function logChange(action, detail) {
  if (!data._auditLog) data._auditLog = [];
  data._auditLog.unshift({
    id: 'log' + Date.now(),
    ts: new Date().toISOString(),
    who: currentUserName(),
    email: window.currentUser ? window.currentUser.email : '',
    action,
    detail
  });
  // Keep last 200 entries
  if (data._auditLog.length > 200) data._auditLog = data._auditLog.slice(0, 200);
}

function currentUserName() {
  if (!window.currentUser) return 'Unknown';
  return window.currentUser.displayName || window.currentUser.email.split('@')[0];
}

function signedInUsers() {
  const users = data._users || {};
  return Object.values(users).sort((a,b) => (a.name||a.email).localeCompare(b.name||b.email));
}

function userDropdown(selectId, defaultVal) {
  const users = signedInUsers();
  const defVal = defaultVal || currentUserName();
  let opts = users.map(u => {
    const name = u.name || u.email;
    return `<option value="${name}" ${name===defVal?'selected':''}>${name}</option>`;
  }).join('');
  // If defaultVal not in list, add it as first option
  if (defaultVal && !users.find(u=>(u.name||u.email)===defaultVal)) {
    opts = `<option value="${defaultVal}" selected>${defaultVal}</option>` + opts;
  }
  return `<select class="form-select" id="${selectId}">${opts}</select>`;
}

let data = {
  workspaces: [
    { id: 'w1', name: 'Work', color: '#2563eb' },
    { id: 'w2', name: 'Community', color: '#059669' },
    { id: 'w3', name: 'Home', color: '#7c3aed' },
  ],
  activeWorkspace: null,
  projects: [],
  inbox: [],
  workSort: { today:[], tomorrow:[], thisweek:[], nextweek:[] },
  routines: [],
};

let currentView = 'dashboard';
let currentProject = null;
let currentTab = 'tasks';
let currentActionsFilter = 'open';
let projectsViewMode = 'table';
let currentTask = null;
let currentWorkDay = 'today';

// ── HELPERS ───────────────────────────────────────────────────────────────────
const today = () => new Date().toISOString().split('T')[0];
const fmtDate = d => { if (!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); };
const fmtEst = m => m < 60 ? `${m}m` : `${Math.floor(m/60)}h${m%60?` ${m%60}m`:''}`;
const isPast = d => d && d < today();
const isToday = d => d === today();
const addDays = (d, n) => { if (!d) return ''; const dt = new Date(d+'T00:00:00'); dt.setDate(dt.getDate()+Number(n||0)); return dt.toISOString().split('T')[0]; };

const statusLabel = s => ({ active:'On Track', 'at-risk':'At Risk', stuck:'Stuck', draft:'Draft', done:'Done', 'in-progress':'In Progress', pending:'Pending', complete:'Complete' }[s] || s);
const statusTag = s => {
  const map = { active:'green', 'on-track':'green', 'at-risk':'amber', stuck:'red', draft:'gray', done:'gray', 'in-progress':'blue', pending:'gray', complete:'green', waiting:'amber' };
  return `tag tag-${map[s]||'gray'}`;
};
const actionIcon = t => ({ Call:'📞', Meeting:'📅', Research:'🔬', 'Blocked Time':'⏰', 'Follow Up':'📤', Other:'🔹' }[t]||'🔹');
const actionBg = t => ({ Call:'#eff6ff', Meeting:'#faf5ff', Research:'#f0fdf4', 'Blocked Time':'#fff7ed', 'Follow Up':'#eff6ff', Other:'#f9fafb' }[t]||'#f9fafb');

function getWS(id) { return data.workspaces.find(w=>w.id===id); }
function activeProjects() {
  const ws = data.activeWorkspace;
  return ws ? data.projects.filter(p=>p.ws===ws) : data.projects;
}
function activeRoutines() {
  const ws = data.activeWorkspace;
  return ws ? data.routines.filter(r=>r.ws===ws) : data.routines;
}
function inferRoutineRepeat(routine) {
  if (routine.repeat) return routine.repeat;
  if ((routine.time || '').startsWith('Mon')) return 'weekly';
  return 'daily';
}
function inferRoutineWeekday(routine) {
  if (typeof routine.weekday === 'number') return routine.weekday;
  const map = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
  const key = (routine.time || '').slice(0,3);
  return map[key] ?? 1;
}
function routineClockTime(routine) {
  if (routine.clockTime) return routine.clockTime;
  if ((routine.time || '').includes(' ')) return routine.time.split(' ').slice(-1)[0];
  return routine.time || '09:00';
}
function routineRepeatLabel(routine) {
  const repeat = inferRoutineRepeat(routine);
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  if (repeat === 'weekdays') return 'Repeats weekdays';
  if (repeat === 'weekly') return 'Repeats every ' + days[inferRoutineWeekday(routine)];
  return 'Repeats daily';
}
function routineRunsToday(routine) {
  const repeat = inferRoutineRepeat(routine);
  const day = new Date().getDay();
  if (repeat === 'daily') return true;
  if (repeat === 'weekdays') return day >= 1 && day <= 5;
  if (repeat === 'weekly') return day === inferRoutineWeekday(routine);
  return true;
}
function ensureProjectDefaults() {
  data.projects.forEach(p => {
    if (!p.updateCadenceDays) p.updateCadenceDays = 7;
    if (!p.lastUpdated) p.lastUpdated = today();
    if (!p.captures) p.captures = [];
    (p.tasks || []).forEach(t => {
      if (!t.captures) t.captures = [];
      (t.actions || []).forEach(a => {
        if (!a.captures) a.captures = [];
      });
    });
  });
  data.routines.forEach(r => {
    if (!r.repeat) r.repeat = inferRoutineRepeat(r);
    if (typeof r.weekday !== 'number') r.weekday = inferRoutineWeekday(r);
    if (!r.clockTime) r.clockTime = routineClockTime(r);
  });
}
function fmtStamp(s) {
  if (!s) return '—';
  const dt = new Date(s);
  return dt.toLocaleString('en-GB',{ day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}
function captureKindLabel(kind) {
  return ({ note:'Note', link:'Research link', attachment:'Attachment / file ref' }[kind] || 'Capture');
}
function captureTargetOptions(selectedValue='') {
  const opts = [];
  activeProjects().forEach(p => {
    opts.push({ value:`project|${p.id}`, label:`Project · ${p.name}` });
    (p.tasks || []).forEach(t => {
      opts.push({ value:`task|${p.id}|${t.id}`, label:`Task · ${p.name} / ${t.title}` });
      (t.actions || []).forEach(a => {
        opts.push({ value:`action|${p.id}|${t.id}|${a.id}`, label:`Action · ${p.name} / ${t.title} / ${a.title}` });
      });
    });
  });
  return opts.map(o=>`<option value="${o.value}" ${o.value===selectedValue?'selected':''}>${o.label}</option>`).join('');
}
function getCaptureContext(projectId, taskId='', actionId='') {
  const project = data.projects.find(p=>p.id===projectId);
  const task = project?.tasks.find(t=>t.id===taskId);
  const action = task?.actions.find(a=>a.id===actionId);
  return { project, task, action };
}
function projectCaptureRollup(project) {
  const items = [];
  (project.captures || []).forEach(c => items.push({ ...c, level:'project', levelLabel:'Project', itemTitle:project.name }));
  (project.tasks || []).forEach(t => {
    (t.captures || []).forEach(c => items.push({ ...c, level:'task', levelLabel:`Task · ${t.title}`, itemTitle:t.title }));
    (t.actions || []).forEach(a => {
      (a.captures || []).forEach(c => items.push({ ...c, level:'action', levelLabel:`Action · ${t.title}`, itemTitle:a.title }));
    });
  });
  return items.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
}
function projectCaptureCounts(project) {
  return {
    project: (project.captures || []).length,
    task: (project.tasks || []).reduce((s,t)=>s + (t.captures || []).length, 0),
    action: (project.tasks || []).reduce((s,t)=>s + (t.actions || []).reduce((n,a)=>n + (a.captures || []).length, 0), 0)
  };
}
function captureRefHtml(ref) {
  if (!ref) return '';
  const safe = String(ref).replace(/"/g,'&quot;');
  const label = safe.length > 70 ? safe.slice(0,70) + '…' : safe;
  if (/^https?:\/\//i.test(safe)) return `<a href="${safe}" target="_blank" style="color:var(--accent);text-decoration:none">${label}</a>`;
  return `<span>${label}</span>`;
}
function renderProjectInfoHub(project) {
  const counts = projectCaptureCounts(project);
  const items = projectCaptureRollup(project);
  return `
    <div class="stat-grid" style="margin-bottom:16px">
      <div class="stat-card"><div><div class="stat-label">Project captures</div><div class="stat-num">${counts.project}</div><div class="stat-sub">notes on the project itself</div></div><div class="stat-icon" style="background:#eff6ff">📝</div></div>
      <div class="stat-card"><div><div class="stat-label">Task captures</div><div class="stat-num">${counts.task}</div><div class="stat-sub">research or context on tasks</div></div><div class="stat-icon" style="background:#f5f3ff">📚</div></div>
      <div class="stat-card"><div><div class="stat-label">Action captures</div><div class="stat-num">${counts.action}</div><div class="stat-sub">info attached to specific moves</div></div><div class="stat-icon" style="background:#ecfdf5">📎</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn-ghost" onclick="openCaptureInbox('project|${project.id}')">+ Add Note / Link</button>
    </div>
    ${items.length ? `<div class="card">${items.map(item=>`
      <div class="action-row" style="align-items:flex-start;border-bottom:1px solid var(--border)">

}
function projectNextAction(project) {
  return project.tasks
    .flatMap(t => t.actions.filter(a => a.status === 'pending').map(a => ({...a, taskTitle: t.title})))
    .sort((a,b) => (a.scheduled||'9999-12-31').localeCompare(b.scheduled||'9999-12-31'))[0] || null;
}
function projectNextActionDate(project) {
  return projectNextAction(project)?.scheduled || '';
}
function projectUpdateDue(project) {
  return addDays(project.lastUpdated || today(), project.updateCadenceDays || 7);
}
function projectUpdateState(project) {
  const due = projectUpdateDue(project);
  if (!due) return 'gray';
  if (isPast(due)) return 'red';
  if (isToday(due)) return 'amber';
  return 'gray';
}
function projectHealth(project) {
  if (project.status === 'done') return { tone:'gray', label:'Done' };
  if (project.status === 'stuck') return { tone:'red', label:'Stuck' };
  if (projectUpdateState(project) === 'red') return { tone:'red', label:'Update overdue' };
  if (project.status === 'at-risk') return { tone:'amber', label:'At risk' };
  if (project.status !== 'draft' && !projectNextActionDate(project)) return { tone:'amber', label:'Missing next action date' };
  if (projectUpdateState(project) === 'amber') return { tone:'amber', label:'Update due today' };
  if (project.status === 'draft') return { tone:'gray', label:'Draft' };
  return { tone:'green', label:'Healthy' };
}
function healthTagClass(project) {
  return 'tag tag-' + projectHealth(project).tone;
}
function healthTagVisible(p) {
  var h = projectHealth(p);
  var skip = {active:['Healthy'],'at-risk':['At risk'],stuck:['Stuck'],done:['Done'],draft:['Draft']};
  return (skip[p.status]||[]).indexOf(h.label) === -1;
}
function todayActions() {
  return activeProjects().flatMap(p=>
    p.tasks.flatMap(t=>
      t.actions.filter(a=>a.status==='pending'&&(isToday(a.scheduled)||isPast(a.scheduled)))
        .map(a=>({...a,projectName:p.name,projectId:p.id,taskId:t.id,taskTitle:t.title}))
    )
  );
}
function completedActions() {
  return activeProjects().flatMap(p=>
    p.tasks.flatMap(t=>
      t.actions.filter(a=>a.status==='complete')
        .map(a=>({...a,projectName:p.name,projectId:p.id,taskId:t.id,taskTitle:t.title}))
    )
  ).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||'') || a.title.localeCompare(b.title));
}
function waitingItems() {
  return activeProjects().flatMap(p=>
    p.tasks.flatMap(t=>
      t.actions.filter(a=>a.owner&&a.owner!==currentUserName()&&a.status==='pending')
        .map(a=>({...a,projectName:p.name,projectId:p.id}))
    )
  );
}
function openCaptureInbox(defaultValue='') {
  openModal('Capture Note / Link / Attachment', `
    <div class="form-group">
      <label class="form-label">Attach to <span style="color:var(--red)">*</span></label>
      <select class="form-select" id="cap-target">
        <option value="">&#8212; Select a project or task &#8212;</option>
        ${captureTargetOptions(defaultValue)}
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label class="form-label">Type</label>
        <select class="form-select" id="cap-kind">
          <option value="note">Note</option>
          <option value="link">Research link</option>
          <option value="attachment">Attachment / file ref</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Title</label>
        <input class="form-input" id="cap-title" placeholder="Short label for this capture">
      </div>
    </div>

    </div>

      <label class="form-label">Reference link or attachment path</label>
      <input class="form-input" id="cap-ref" placeholder="https://... or file name / path / attachment reference">
    </div>
  `, ()=>{
    const target = document.getElementById('cap-target').value;
    if (!target) { alert('Please select a project or task to attach this to'); return; }
    const kind = document.getElementById('cap-kind').value;
    const title = document.getElementById('cap-title').value.trim() || captureKindLabel(kind);
    const text = document.getElementById('cap-text').value.trim();
    const ref = document.getElementById('cap-ref').value.trim();
    if (!text && !ref) { alert('Please add some capture content or a reference'); return; }
    const [level, projectId, taskId, actionId] = target.split('|');
    const { project, task, action } = getCaptureContext(projectId, taskId, actionId);
    const capture = { id:'cap'+Date.now(), kind, title, text, ref, createdAt:new Date().toISOString() };
    if (level === 'project' && project) project.captures.push(capture);
    if (level === 'task' && task) task.captures.push(capture);
    if (level === 'action' && action) action.captures.push(capture);
    if (project) project.lastUpdated = today();
    closeModal(); notify('Capture saved'); render();
  }, 'Save Capture');
}

function deleteWorkspace(id) {
  const ws = data.workspaces.find(w=>w.id===id);
  if (!ws) return;
  const hasProjects = data.projects.some(p=>p.ws===id);
  if (hasProjects) {
    alert('Cannot delete "' + ws.name + '" — it has projects. Move or delete those projects first.');
    return;
  }
  if (!confirm('Delete workspace "' + ws.name + '"? This cannot be undone.')) return;
  logChange('Workspace deleted', ws.name);
  data.workspaces = data.workspaces.filter(w=>w.id!==id);
  if (data.activeWorkspace === id) data.activeWorkspace = null;
  window._localSave = true;
  if (window.scheduleSave) window.scheduleSave();
  notify('Workspace deleted');
  render();
}

function setWorkspace(id) {
  data.activeWorkspace = id;
  renderSidebar();
  render();
}

function setView(v) {
  if (v==='actions'||v==='waiting'||v==='issues') v='mywork';
  if (v==='inbox') { currentView='inbox'; currentProject=null; currentTask=null;
    ['mywork','dashboard','projects','routine','admin','alltasks','allactions'].forEach(function(x){var e=document.getElementById('nav-'+x);if(e)e.classList.remove('active');});
    var ni=document.getElementById('nav-inbox');if(ni)ni.classList.add('active'); renderInboxView(); return; }
  if (v==='alltasks') { if(!window.isAdmin)return; currentView='alltasks'; currentProject=null; currentTask=null;
    ['mywork','dashboard','projects','routine','admin','inbox','allactions'].forEach(function(x){var e=document.getElementById('nav-'+x);if(e)e.classList.remove('active');});
    var nat=document.getElementById('nav-alltasks');if(nat)nat.classList.add('active'); renderAllTasks(); return; }
  if (v==='allactions') { if(!window.isAdmin)return; currentView='allactions'; currentProject=null; currentTask=null;
    ['mywork','dashboard','projects','routine','admin','inbox','alltasks'].forEach(function(x){var e=document.getElementById('nav-'+x);if(e)e.classList.remove('active');});
    var naa=document.getElementById('nav-allactions');if(naa)naa.classList.add('active'); renderAllActions(); return; }
  // Admin panel
  if (v==='admin') {
    if (!window.isAdmin) return;
    currentView = 'admin';
    currentProject = null;
    currentTask = null;
    ['mywork','dashboard','projects','routine'].forEach(x=>{
      document.getElementById('nav-'+x)?.classList.remove('active');
    });
    document.getElementById('nav-admin')?.classList.add('active');
    renderAdminPanel();
    return;
  }
  currentView = v;
  currentProject = null;
  currentTask = null;
  ['mywork','dashboard','projects','routine','admin','inbox','alltasks','allactions'].forEach(x=>{
    document.getElementById('nav-'+x)?.classList.remove('active');
  });
  document.getElementById('nav-'+v)?.classList.add('active');
  render();
}

    const score = (p) => (
      p.health.tone === 'red' ? 0 :
      p.health.label === 'Missing next action date' ? 1 :
      p.health.tone === 'amber' ? 2 :
      p.status === 'draft' ? 4 : 3
    );
    return score(a) - score(b) || (a.nextActionDate || '9999-12-31').localeCompare(b.nextActionDate || '9999-12-31') || a.name.localeCompare(b.name);
  });

      </div>
      <div class="stat-card">
        <div><div class="stat-label">No Next Action Date</div><div class="stat-num">${noNextAction}</div><div class="stat-sub">projects missing a scheduled move</div></div>
        <div class="stat-icon" style="background:#f5f3ff">→</div>
      </div>
    </div>

    <div class="card">
      <div class="section-header">
        <div class="section-title">Project overview</div>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:12px;color:var(--text-sub)">Status &middot; where it's up to &middot; next move &middot; update cycle</span>
          <div style="display:flex;gap:3px;background:#f3f4f6;border-radius:7px;padding:3px;flex-shrink:0">
            <button onclick="setProjectsView('table')" id="pvbtn-table" style="border-radius:5px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid transparent;background:white;color:var(--text)">Table</button>
            <button onclick="setProjectsView('cards')" id="pvbtn-cards" style="border-radius:5px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid transparent;background:transparent;color:var(--text-sub)">Cards</button>
          </div>
        </div>
      </div>
      <div id="projects-body"></div>
    </div>
  `;
  renderProjectsBody(projs);
}

function setProjectsView(mode) {
  projectsViewMode = mode;
  var t = document.getElementById('pvbtn-table');
  var k = document.getElementById('pvbtn-cards');
  if(t){t.style.background=mode==='table'?'white':'transparent';t.style.color=mode==='table'?'var(--text)':'var(--text-sub)';t.style.border=mode==='table'?'1px solid var(--border)':'1px solid transparent';}
  if(k){k.style.background=mode==='cards'?'white':'transparent';k.style.color=mode==='cards'?'var(--text)':'var(--text-sub)';k.style.border=mode==='cards'?'1px solid var(--border)':'1px solid transparent';}
  var pb = document.getElementById('projects-body');
  if(!pb) return;
  // re-fetch current projs
  var projs = activeProjects().map(function(p){return Object.assign({},p,{nextAction:projectNextAction(p),nextActionDate:projectNextActionDate(p),updateDue:projectUpdateDue(p),updateState:projectUpdateState(p),health:projectHealth(p)});}).sort(function(a,b){var s=function(p){return p.health.tone==='red'?0:p.health.label==='Missing next action date'?1:p.health.tone==='amber'?2:p.status==='draft'?4:3;};return s(a)-s(b)||((a.nextActionDate||'9999-12-31').localeCompare(b.nextActionDate||'9999-12-31'))||a.name.localeCompare(b.name);});
  renderProjectsBody(projs);
}

function renderProjectsBody(projs) {
  var el = document.getElementById('projects-body');
  if(!el) return;
  if(projectsViewMode === 'table') {
    var rows = projs.map(function(p){
      return '<tr onclick="openProject(&quot;'+p.id+'&quot;)" style="cursor:pointer">' +
        '<td><div class="overview-name">'+p.name+'</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap"><span class="'+statusTag(p.status)+'">'+statusLabel(p.status)+'</span>' +
        (healthTagVisible(p) ? ('<span class="'+healthTagClass(p)+'">'+p.health.label+'</span>') : '') +
        '<span class="ws-badge tag tag-'+(p.ws==='w1'?'blue':p.ws==='w2'?'green':'purple')+'">'+(getWS(p.ws)&&getWS(p.ws).name||'')+'</span></div>' +
        '<div class="mini-meta">'+p.owner+'</div></td>' +
        '<td><div class="overview-where">'+(p.whereItsAt||'&mdash;')+'</div></td>' +
        '<td><div class="overview-next">'+(p.nextStep||'&mdash;')+'</div>' +
        '<div class="mini-meta">Health: <span style="color:'+(p.health.tone==='red'?'var(--red)':p.health.tone==='amber'?'var(--amber)':p.health.tone==='green'?'var(--green)':'var(--text-sub)')+'">'+p.health.label+'</span></div></td>' +
        '<td><div style="font-weight:600;color:'+(p.nextActionDate&&isPast(p.nextActionDate)?'var(--red)':'var(--text)')+'">'+fmtDate(p.nextActionDate)+'</div>' +
        '<div class="mini-meta">'+(p.nextAction?p.nextAction.title:'No action scheduled')+'</div></td>' +
        '<td><div><span class="tag tag-'+p.updateState+'">'+(p.updateState==='red'?'Past due':p.updateState==='amber'?'Due today':'On cycle')+'</span></div>' +
        '<div class="mini-meta" style="margin-top:6px">'+fmtDate(p.updateDue)+' &middot; every '+p.updateCadenceDays+'d</div>' +
        '<div class="mini-meta">Last update '+fmtDate(p.lastUpdated)+'</div></td>' +
        '<td onclick="event.stopPropagation()" style="white-space:nowrap">' +
        '<button onclick="openEditProject(&quot;'+p.id+'&quot;)" style="background:none;border:1px solid var(--border);color:var(--text-sub);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit;margin-right:4px">✏️ Edit</button>' +
        '<button onclick="deleteProject(&quot;'+p.id+'&quot;)" style="background:none;border:1px solid #fecaca;color:var(--red);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit">🗑</button>' +
        '</td>' +
        '</tr>';
    }).join('');
    el.innerHTML = '<table class="overview-table"><thead><tr><th>Project</th><th>Where it\'s up to</th><th>Next step</th><th>Next action date</th><th>Next update due</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
  } else {
    var cards = projs.map(function(p){
      return '<div onclick="openProject(&quot;'+p.id+'&quot;)" style="padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px">' +
        '<div class="project-dot" style="background:'+(p.health.tone==='red'?'var(--red)':p.health.tone==='amber'?'var(--amber)':p.health.tone==='green'?'var(--green)':'#9ca3af')+'"></div>' +
        '<div style="flex:1;min-width:0">' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div class="project-name">'+p.name+'</div>' +
        '<span class="'+statusTag(p.status)+'">'+statusLabel(p.status)+'</span>' +
        '<span class="ws-badge tag tag-'+(p.ws==='w1'?'blue':p.ws==='w2'?'green':'purple')+'">'+(getWS(p.ws)&&getWS(p.ws).name||'')+'</span></div>' +
        '<div class="project-meta" style="margin-top:4px">'+(p.whereItsAt||'').slice(0,90)+((p.whereItsAt||'').length>90?'&hellip;':'')+'</div>' +
        '<div class="project-next">&rarr; '+(p.nextStep||'&mdash;')+'</div></div>' +
        '<div style="text-align:right;flex-shrink:0;min-width:90px"><span class="'+healthTagClass(p)+'">'+p.health.label+'</span>' +
        '<div style="font-size:10px;color:var(--text-dim);margin-top:4px">Next: '+(fmtDate(p.nextActionDate)||'&mdash;')+'</div>' +
        '<div style="font-size:10px;color:'+(p.updateState==='red'?'var(--red)':p.updateState==='amber'?'var(--amber)':'var(--text-dim)')+';margin-top:2px">Update: '+fmtDate(p.updateDue)+'</div></div>' +
        '</div>';
    }).join('');

  }
}
// ── ACTIONS ────────────────────────────────────────────────────────────────────────────────
function renderActions() {
  const td = todayActions();
  const upcoming = activeProjects().flatMap(p=>p.tasks.flatMap(t=>t.actions.filter(a=>a.status==='pending'&&a.scheduled>today()).map(a=>({...a,projectName:p.name,projectId:p.id,taskId:t.id,taskTitle:t.title}))));
  const done = completedActions();
  const showOpen = currentActionsFilter !== 'completed';
  const showCompleted = currentActionsFilter !== 'open';
  const filterBtn = (key, label, count) => `
    <button onclick="setActionFilter('${key}')" style="border:1px solid ${currentActionsFilter===key?'var(--accent)':'var(--border)'};background:${currentActionsFilter===key?'#eff6ff':'white'};color:${currentActionsFilter===key?'var(--accent)':'var(--text-sub)'};border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">${label} <span style="opacity:.72">${count}</span></button>`;
  document.getElementById('main-content').innerHTML = `
    <div class="card" style="margin-bottom:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div>
        <div style="font-size:13px;font-weight:700">Action view</div>
        <div style="font-size:12px;color:var(--text-sub)">Switch between open work and completed history without losing visibility.</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${filterBtn('open','Open', td.length + upcoming.length)}
        ${filterBtn('completed','Completed', done.length)}
        ${filterBtn('all','All', td.length + upcoming.length + done.length)}
      </div>
    </div>

    ${showOpen && td.length ? `
    <div style="margin-bottom:20px">
      <div style="font-size:11px;font-weight:600;color:var(--red);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Due Today · ${td.reduce((s,a)=>s+a.est,0)} min</div>
      <div class="card" style="padding:6px 18px">
        ${td.map(a=>`
          <div class="action-row">
            <div class="action-icon" style="background:${actionBg(a.type)}">${actionIcon(a.type)}</div>
            <div style="flex:1;min-width:0">
              <div class="action-title">${a.title}</div>
              <div class="action-meta">${a.projectName} · ${a.taskTitle} · ${fmtEst(a.est)} · ${a.owner}</div>
            </div>
            <span class="tag tag-gray">${a.type}</span>
            <button onclick="completeAction('${a.projectId}','${a.taskId}','${a.id}')" style="background:var(--green-light);border:1px solid #bbf7d0;color:var(--green);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;margin-left:6px">Done</button>
            <button onclick="deferAction('${a.projectId}','${a.taskId}','${a.id}')" style="background:var(--amber-light);border:1px solid #fde68a;color:var(--amber);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;margin-left:4px">Defer</button>
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    ${showOpen && upcoming.length ? `
    <div style="margin-bottom:20px">
      <div style="font-size:11px;font-weight:600;color:var(--text-sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Upcoming</div>
      <div class="card" style="padding:6px 18px">
        ${upcoming.map(a=>`
          <div class="action-row">
            <div class="action-icon" style="background:${actionBg(a.type)}">${actionIcon(a.type)}</div>
            <div style="flex:1;min-width:0">
              <div class="action-title">${a.title}</div>
              <div class="action-meta">${a.projectName} · ${a.taskTitle} · ${fmtEst(a.est)} · ${a.owner}</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <span class="tag tag-gray">${a.type}</span>
              <div style="font-size:10px;color:var(--text-dim);margin-top:4px">${fmtDate(a.scheduled)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    ${showCompleted && done.length ? `
    <details class="card" style="padding:10px 18px" ${currentActionsFilter==='completed' ? 'open' : ''}>
      <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px">Completed Actions <span style="font-size:12px;color:var(--text-sub);text-transform:none;letter-spacing:0">${done.length} items</span></summary>
      <div style="margin-top:10px">
        ${done.map(a=>`
          <div class="action-row" style="align-items:flex-start">
            <div class="action-icon" style="background:#ecfdf5">✓</div>
            <div style="flex:1;min-width:0">
              <div class="action-title" style="color:var(--text-sub)">${a.title}</div>
              <div class="action-meta">${a.projectName} · ${a.taskTitle} · completed ${fmtDate(a.completedAt)}${a.completedBy ? ` · ${a.completedBy}` : ''}</div>
              ${a.completionNote ? `<div style="font-size:12px;color:var(--text-sub);margin-top:6px">${a.completionNote}</div>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span class="tag tag-green">Done</span>
              <button onclick="reopenAction('${a.projectId}','${a.taskId}','${a.id}')" style="background:white;border:1px solid var(--border);color:var(--text-sub);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">Reopen</button>
            </div>
          </div>
        `).join('')}
      </div>
    </details>` : ''}

    ${((showOpen && !td.length && !upcoming.length) && (!showCompleted || !done.length)) || (currentActionsFilter==='completed' && !done.length) ? '<div class="empty" style="margin-top:60px"><div class="empty-icon">⚡</div><div class="empty-text">No action items in this filter</div></div>' : ''}
  `;
}

// ── ROUTINE ───────────────────────────────────────────────────────────────────
function renderRoutine() {
  const rt = activeRoutines();
  const todayList = rt.filter(routineRunsToday);
  const laterList = rt.filter(r=>!routineRunsToday(r));
  const renderRoutineCard = (r) => {
    const done = r.steps.filter(s=>s.done).length;
    const pct = Math.round(done/r.steps.length*100);
    return `
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap">
          <div>
            <div style="font-size:15px;font-weight:600">${r.name}</div>
            <div style="font-size:12px;color:var(--text-sub);margin-top:2px">${routineClockTime(r)} · ${getWS(r.ws)?.name} · ${routineRepeatLabel(r)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <span class="tag ${routineRunsToday(r)?'tag-green':'tag-gray'}">${routineRunsToday(r)?'Scheduled today':'Later in cycle'}</span>
            <div style="text-align:right">
              <div style="font-size:20px;font-weight:700;color:${pct===100?'var(--green)':'var(--accent)'}">${pct}%</div>
              <div style="font-size:11px;color:var(--text-dim)">${done}/${r.steps.length} steps</div>
            </div>
          </div>
        </div>
        <div style="height:4px;background:var(--border);border-radius:2px;margin-bottom:14px">
          <div style="height:4px;background:${pct===100?'var(--green)':'var(--accent)'};border-radius:2px;width:${pct}%;transition:width 0.3s"></div>
        </div>
        ${r.steps.map(s=>`
          <div class="routine-row" onclick="toggleStep('${s.id}')">
            <div class="routine-check ${s.done?'done':'pending'}">${s.done?'✓':''}</div>
            <div class="routine-name ${s.done?'done':''}">${s.title}</div>
          </div>
        `).join('')}
      </div>
    `;
  };
  document.getElementById('main-content').innerHTML = `
    <div class="card" style="margin-bottom:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div>
        <div style="font-size:13px;font-weight:700">Repeating routines</div>
        <div style="font-size:12px;color:var(--text-sub)">Create routines that repeat daily, on weekdays, or on a chosen weekday with a set time and checklist.</div>
      </div>
      <button class="btn-primary" onclick="openAddRoutine()">+ Add Routine</button>
    </div>
    ${todayList.length ? `<div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Scheduled today</div>${todayList.map(renderRoutineCard).join('')}` : ''}
    ${laterList.length ? `<div style="font-size:11px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:1px;margin:8px 0 10px">Other repeating routines</div>${laterList.map(renderRoutineCard).join('')}` : ''}
    ${!todayList.length && !laterList.length ? '<div class="empty" style="margin-top:60px"><div class="empty-icon">↻</div><div class="empty-text">No routines for this workspace</div></div>' : ''}
  `;
}

// ── WAITING ───────────────────────────────────────────────────────────────────

// ── PROJECT DETAIL ────────────────────────────────────────────────────────────
function openProject(id) {
  currentProject = data.projects.find(p=>p.id===id);
  currentTab = 'tasks';
  renderProjectDetail();
}

            <span class="tag tag-${p.ws==='w1'?'blue':p.ws==='w2'?'green':'purple'}">${getWS(p.ws)?.name}</span>
            <span class="tag tag-gray">👤 ${p.owner}</span>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">

      </div>` : `
      <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;margin-top:10px">

        <div style="font-size:12px;color:#991b1b">This project has no scheduled action item. Add one to keep it moving.</div>

      <div class="detail-grid" style="grid-template-columns:repeat(4,1fr)">

function setTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach(el=>{
    el.classList.toggle('active', el.dataset.tab === t);
  });
  renderTab();
}

function renderTab() {
  const p = currentProject;
  const el = document.getElementById('tab-content');
  if (!el) return;

  if (currentTab === 'tasks') {
    const tasks = visibleTasks(p, [...p.tasks]).sort((a,b)=>(a.status==='complete'?1:0)-(b.status==='complete'?1:0)||a.title.localeCompare(b.title));
    if (!tasks.length) {
      el.innerHTML = '<div class="empty" style="margin-top:40px"><div class="empty-icon">📋</div><div class="empty-text">No tasks yet</div></div>';
      return;
    }
    el.innerHTML = tasks.map(t => {
      const openActions = visibleActions(p, t, t.actions.filter(a=>a.status==='pending'));
      const doneActions = visibleActions(p, t, t.actions.filter(a=>a.status==='complete')).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));
      const taskDone = t.status === 'complete';
      const blocker = t.blocker && t.blocker.active;

      // Build action cards HTML
      const actionCards = openActions.map(a => `
        <div onclick="openActionCard('${p.id}','${t.id}','${a.id}')" style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:border-color 0.15s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
          <div style="display:flex;align-items:center;gap:10px;padding:10px 12px">
            <div style="width:28px;height:28px;border-radius:7px;background:${actionBg(a.type)};display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">${actionIcon(a.type)}</div>
