      return `
      <div style="background:white;border:1px solid ${blocker?'#fecaca':taskDone?'#bbf7d0':'var(--border)'};border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)">

        <!-- Task Header -->
        <div style="padding:14px 16px;border-bottom:${openActions.length||doneActions.length?'1px solid var(--border)':'none'}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">
                <div style="width:6px;height:6px;border-radius:50%;background:${taskDone?'var(--green)':blocker?'var(--red)':t.status==='in-progress'?'var(--accent)':t.status==='at-risk'?'var(--amber)':'#9ca3af'};flex-shrink:0"></div>
                <div style="font-size:14px;font-weight:700;color:var(--accent);cursor:pointer" onclick="openTask('${p.id}','${t.id}')">${t.title}</div>
                ${t.isIssue ? '<span class="tag tag-red" style="font-size:10px">Issue</span>' : ''}
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
                <span class="${statusTag(t.status)}">${statusLabel(t.status)}</span>
                <span class="tag tag-gray" style="font-size:10px">👤 ${t.owner}</span>
                ${t.due ? `<span class="tag ${isPast(t.due)&&!taskDone?'tag-red':'tag-gray'}" style="font-size:10px">Due ${fmtDate(t.due)}</span>` : ''}
                ${blocker ? `<span class="tag tag-red" style="font-size:10px">⚠ Blocked</span>` : ''}
                ${openActions.length ? `<span style="font-size:10px;color:var(--text-dim)">${openActions.length} open action${openActions.length!==1?'s':''}</span>` : ''}
                ${doneActions.length ? `<span style="font-size:10px;color:var(--green)">${doneActions.length} done</span>` : ''}
              </div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0">
              ${!taskDone ? `
                <button onclick="openEditTask('${p.id}','${t.id}')" style="background:none;border:1px solid var(--border);color:var(--text-sub);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit">✏️ Edit</button>
                <button onclick="deleteTask('${p.id}','${t.id}')" style="background:none;border:1px solid #fecaca;color:var(--red);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit">🗑</button>
                <button onclick="openTaskUpdateForm('${p.id}','${t.id}')" style="background:none;border:1px solid var(--border);color:var(--text-sub);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit">Update</button>
                <button onclick="openAddActionForTask('${p.id}','${t.id}')" style="background:none;border:1px solid var(--border);color:var(--text-sub);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit">+ Action</button>
                <button onclick="completeTask('${p.id}','${t.id}')" style="background:var(--green-light);border:1px solid #bbf7d0;color:var(--green);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">Done</button>
              ` : `
                <button onclick="openEditTask('${p.id}','${t.id}')" style="background:none;border:1px solid var(--border);color:var(--text-sub);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit">✏️ Edit</button>
                <button onclick="deleteTask('${p.id}','${t.id}')" style="background:none;border:1px solid #fecaca;color:var(--red);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit">🗑</button>
                <button onclick="reopenTask('${p.id}','${t.id}')" style="background:none;border:1px solid var(--border);color:var(--text-sub);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit">Reopen</button>
              `}
            </div>
          </div>

          ${blocker ? `
          <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:8px 10px;margin-top:10px;font-size:12px;color:#7f1d1d">
            ⚠ Blocked: ${t.blocker.what} &middot; ${t.blocker.who}
            <button onclick="openTask('${p.id}','${t.id}')" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;font-family:inherit;padding:0;margin-left:6px">View →</button>
          </div>` : ''}

          ${taskDone && t.completionNote ? `
          <div style="background:#ecfdf5;border:1px solid #bbf7d0;border-radius:6px;padding:8px 10px;margin-top:10px;font-size:12px;color:#065f46">
            ✓ ${t.completionNote}
          </div>` : ''}
        </div>

        <!-- Actions section -->
        ${openActions.length && !taskDone ? `
        <div style="padding:10px 16px;background:#fafbfc">
          <div style="font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Actions</div>
          ${actionCards}
        </div>` : ''}

        ${!openActions.length && !taskDone ? `
        <div style="padding:10px 16px;background:#fafbfc">
          <div style="font-size:11px;color:var(--text-dim);font-style:italic">No open actions — <button onclick="openAddActionForTask('${p.id}','${t.id}')" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:11px;font-family:inherit;padding:0">add one to keep this moving</button></div>
        </div>` : ''}

        ${doneActions.length ? `
        <details style="background:#f9fafb;border-top:1px solid var(--border)">
          <summary style="cursor:pointer;padding:8px 16px;font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px;list-style:none">
            Completed Actions (${doneActions.length})
          </summary>
          <div style="padding:0 16px 10px">
            ${doneActions.map(a=>`
              <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)">
                <div style="width:20px;height:20px;border-radius:5px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--green);flex-shrink:0">✓</div>
                <div style="flex:1;min-width:0">
                  <div style="font-size:12px;color:var(--text-sub);text-decoration:line-through">${a.title}</div>
                  <div style="font-size:10px;color:var(--text-dim)">${a.type} &middot; ${fmtDate(a.completedAt)}${a.completedBy?' &middot; '+a.completedBy:''}</div>
                  ${a.completionNote?`<div style="font-size:11px;color:var(--text-sub);margin-top:2px">${a.completionNote}</div>`:''}
                </div>
                <button onclick="reopenAction('${p.id}','${t.id}','${a.id}')" style="background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:5px;padding:3px 7px;font-size:10px;cursor:pointer;font-family:inherit">Reopen</button>
              </div>
            `).join('')}
          </div>
        </details>` : ''}

      </div>`;
    }).join('');
  } else if (currentTab === 'info') {
    el.innerHTML = renderProjectInfoHub(p);
  } else {
    var pu = p.updates||[];
    var sc = {active:"var(--green)","at-risk":"var(--amber)",stuck:"var(--red)",blocked:"var(--red)",done:"var(--text-dim)"};
    var hh = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
    hh += '<div style="font-size:11px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:1px">Update History</div>';
    hh += '<button onclick="openUpdateForm(\''+p.id+'\',\'\')" class="btn-primary" style="font-size:12px">+ New Update</button></div>';
    if (pu.length) {
      hh += '<div class="card">';
      pu.forEach(function(u) {
        hh += '<div class="update-item">';
        hh += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">';
        hh += '<div style="display:flex;align-items:center;gap:8px">';
        hh += '<span style="font-size:12px;font-weight:600;color:'+(sc[u.status]||"var(--green)")+'">'+statusLabel(u.status)+'</span>';
        hh += '<span style="font-size:11px;color:var(--text-dim)">'+(u.submittedBy||"Me")+' · '+fmtDate(u.submittedAt)+'</span>';
        if (u.editedAt) hh += '<span style="font-size:10px;color:var(--text-dim);font-style:italic">edited '+fmtDate(u.editedAt)+'</span>';
        hh += '</div><div style="display:flex;gap:6px">';
        hh += '<button onclick="openUpdateForm(\''+p.id+'\',\''+u.id+'\')" style="background:none;border:1px solid var(--border);color:var(--text-sub);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit">Edit</button>';
        hh += '<button onclick="deleteProjectUpdate(\''+p.id+'\',\''+u.id+'\')" style="background:none;border:1px solid var(--border);color:var(--red);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit">Delete</button>';
        hh += '</div></div>';
        if (u.whereItsUp) hh += '<div style="font-size:13px;color:var(--text);line-height:1.5;margin-bottom:6px">'+u.whereItsUp+'</div>';
        if (u.completed) hh += '<div style="font-size:12px;color:var(--green);margin-bottom:4px">Completed: '+u.completed+'</div>';
        if (u.nextAction) hh += '<div style="font-size:12px;color:var(--accent);margin-bottom:4px">Next: '+u.nextAction+'</div>';
        if (u.blocker) hh += '<div style="font-size:12px;color:var(--red);margin-bottom:4px">Blocked: '+u.blocker.what+' · '+u.blocker.who+'</div>';
        if (u.followUp) hh += '<div style="font-size:11px;color:var(--text-dim)">Follow up: '+fmtDate(u.followUp)+'</div>';
        if (u.versions&&u.versions.length) { hh += '<details style="margin-top:8px"><summary style="font-size:11px;color:var(--text-dim);cursor:pointer">Version history ('+u.versions.length+')</summary><div style="margin-top:8px;padding:8px;background:#f9fafb;border-radius:6px">'; u.versions.forEach(function(v){ hh += '<div style="font-size:11px;color:var(--text-sub);padding:4px 0;border-bottom:1px solid var(--border)">'+fmtDate(v.savedAt)+' · '+(v.submittedBy||"Me")+': '+(v.whereItsUp||"").slice(0,60)+((v.whereItsUp||"").length>60?"...":"")+'</div>'; }); hh += '</div></details>'; }
        hh += '</div>';
      });
      hh += '</div>';
    } else {
      hh += '<div class="empty" style="margin-top:40px"><div class="empty-icon" style="font-size:28px">-</div><div class="empty-text">No updates yet</div></div>';
    }
    el.innerHTML = hh;
  }
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function completeAction(projId, taskId, actionId) {
  const p = data.projects.find(x=>x.id===projId);
  const t = p?.tasks.find(x=>x.id===taskId);
  const a = t?.actions.find(x=>x.id===actionId);
  if (!a) return;
  openModal('Complete Action Item', `
    <div class="form-group">
      <label class="form-label">Completion Update</label>
      <textarea class="form-textarea" id="complete-note" placeholder="What happened, what was decided, or what finished?"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Completed By</label>
      <input class="form-input" id="complete-by" value="${currentUserName()}" readonly style="background:#f9fafb;color:var(--text-sub)">
    </div>
  `, ()=>{
    const note = document.getElementById('complete-note').value.trim();
    const completedBy = document.getElementById('complete-by').value.trim() || a.owner || currentUserName();
    logChange('Action completed', a.title);
    a.status = 'complete';
    a.completedAt = today();
    a.completedBy = completedBy;
    a.completionNote = note;
    p.lastUpdated = today();
    closeModal();
    notify('Action completed ✓');
    render();
  }, 'Complete Action');
}

function completeTask(projId, taskId) {
  const p = data.projects.find(x=>x.id===projId);
  const t = p?.tasks.find(x=>x.id===taskId);
  if (!t || t.status === 'complete') return;
  const openCount = t.actions.filter(a=>a.status!=='complete').length;
  openModal('Complete Task', `
    <div class="form-group">
      <label class="form-label">Completion Update</label>
      <textarea class="form-textarea" id="task-complete-note" placeholder="What finished, what was achieved, and what matters for later?"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Completed By</label>
      <input class="form-input" id="task-complete-by" value="${currentUserName()}" readonly style="background:#f9fafb;color:var(--text-sub)">
    </div>
    <div style="font-size:12px;color:var(--text-sub);background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 12px">Open actions still on this task: <strong>${openCount}</strong>. Completing the task will close any remaining open actions and keep them visible in completed history.</div>
  `, ()=>{
    const note = document.getElementById('task-complete-note').value.trim();
    const completedBy = document.getElementById('task-complete-by').value.trim() || t.owner || currentUserName();
    logChange('Task completed', t.title + ' on ' + p.name);
    t.status = 'complete';
    t.completedAt = today();
    t.completedBy = completedBy;
    t.completionNote = note;
    t.actions.forEach(a => {
      if (a.status !== 'complete') {
        a.status = 'complete';
        a.completedAt = today();
        a.completedBy = completedBy;
        a.completionNote = a.completionNote || `Closed when task was completed. ${note}`;
      }
    });
    p.lastUpdated = today();
    closeModal();
    notify('Task completed ✓');
    render();
  }, 'Complete Task');
}

function reopenAction(projId, taskId, actionId) {
  const p = data.projects.find(x=>x.id===projId);
  const t = p?.tasks.find(x=>x.id===taskId);
  const a = t?.actions.find(x=>x.id===actionId);
  if (!a) return;
  openModal('Reopen Action Item', `
    <div class="form-group">
      <label class="form-label">Why reopen this action</label>
      <textarea class="form-textarea" id="reopen-note" placeholder="What changed or what still needs to happen?"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Reschedule to</label>
      <input type="date" class="form-input" id="reopen-date" value="${today()}">
    </div>
  `, ()=>{
    const note = document.getElementById('reopen-note').value.trim();
    const date = document.getElementById('reopen-date').value;
    if (!note || !date) { alert('Please add a reopen note and date'); return; }
    a.status = 'pending';
    a.scheduled = date;
    a.reopenedAt = today();
    a.reopenNote = note;
    t.status = t.status === 'complete' ? 'in-progress' : t.status;
    p.lastUpdated = today();
    closeModal();
    notify('Action reopened');
    render();
  }, 'Reopen Action');
}

function reopenTask(projId, taskId) {
  const p = data.projects.find(x=>x.id===projId);
  const t = p?.tasks.find(x=>x.id===taskId);
  if (!t) return;
  openModal('Reopen Task', `
    <div class="form-group">
      <label class="form-label">Why reopen this task</label>
      <textarea class="form-textarea" id="task-reopen-note" placeholder="What is unfinished or what changed?"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">New next action</label>
      <input class="form-input" id="task-reopen-action" placeholder="Optional: create the next action now">
    </div>
    <div class="form-group">
      <label class="form-label">Action date</label>
      <input type="date" class="form-input" id="task-reopen-date" value="${today()}">
    </div>
  `, ()=>{
    const note = document.getElementById('task-reopen-note').value.trim();
    const actionTitle = document.getElementById('task-reopen-action').value.trim();
    const actionDate = document.getElementById('task-reopen-date').value;
    if (!note) { alert('Please add a reopen note'); return; }
    t.status = 'in-progress';
    t.reopenedAt = today();
    t.reopenNote = note;
    if (actionTitle) {
      t.actions.push({ id:'a'+Date.now(), type:'Follow Up', title:actionTitle, est:20, scheduled:actionDate || today(), status:'pending', owner:t.owner || currentUserName(), captures: [] });
    }
    p.lastUpdated = today();
    closeModal();
    notify('Task reopened');
    render();
  }, 'Reopen Task');
}

function deferAction(projId, taskId, actionId) {
  openModal('Defer Action Item', `
    <div class="form-group">
      <label class="form-label">Reason for Deferral</label>
      <textarea class="form-textarea" id="defer-reason" placeholder="Why is this being deferred?"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Reschedule to</label>
      <input type="date" class="form-input" id="defer-date" min="${today()}" value="${tomorrow()}">
    </div>
  `, ()=>{
    const reason = document.getElementById('defer-reason').value.trim();
    const date = document.getElementById('defer-date').value;
    if (!reason || !date) { alert('Please fill in both fields'); return; }
    const p = data.projects.find(x=>x.id===projId);
    const t = p?.tasks.find(x=>x.id===taskId);
    const a = t?.actions.find(x=>x.id===actionId);
    logChange('Action deferred', (a?a.title:'unknown') + ' → ' + date);
    if (a) { a.scheduled = date; a.deferCount = (a.deferCount||0)+1; a.deferReason = reason; }
    if (t) t.deferrals = (t.deferrals||0)+1;
    closeModal(); notify('Deferred — rescheduled'); render();
  });
}

function tomorrow() { const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().split('T')[0]; }

function toggleStep(stepId) {
  data.routines.forEach(r=>r.steps.forEach(s=>{ if(s.id===stepId){ logChange(s.done?'Routine step unchecked':'Routine step checked', s.title); s.done=!s.done; } }));
  render();
}

// ── MODALS ────────────────────────────────────────────────────────────────────
function injectUserDropdowns() {
  ['task-owner-wrap','act2-owner-wrap','proj-owner-wrap'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = userDropdown(id.replace('-wrap',''));
  });
}
function openModal(title, body, onConfirm, confirmLabel='Confirm') {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  setTimeout(injectUserDropdowns, 0);
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn-primary" onclick="modalConfirm()">` + confirmLabel + `</button>
  `;
  window._modalConfirm = onConfirm;
  document.getElementById('modal-overlay').classList.add('open');
}
function modalConfirm() { if (window._modalConfirm) window._modalConfirm(); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

function openAddWorkspace() {
  const colors = WS_COLORS;
  openModal('Add Workspace', `
    <div class="form-group">
      <label class="form-label">Workspace Name</label>
      <input class="form-input" id="ws-name" placeholder="e.g. Personal, Finance, Board...">
    </div>
    <div class="form-group">
      <label class="form-label">Color</label>
      <div style="display:flex;gap:8px">
        ${colors.map((c,i)=>`<div onclick="selectColor(${i})" id="wc-${i}" style="width:28px;height:28px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${i===0?'#1a1d23':'transparent'};transition:border 0.15s"></div>`).join('')}
      </div>
      <input type="hidden" id="ws-color" value="${colors[0]}">
    </div>
  `, ()=>{
    const name = document.getElementById('ws-name').value.trim();
    const color = document.getElementById('ws-color').value;
    if (!name) { alert('Please enter a name'); return; }
    const id = 'w' + Date.now();
    data.workspaces.push({ id, name, color });
    closeModal(); notify('Workspace created'); render();
  }, 'Create Workspace');
}

function selectColor(i) {
  WS_COLORS.forEach((_,j)=>{ const el=document.getElementById('wc-'+j); if(el) el.style.border=j===i?'3px solid #1a1d23':'3px solid transparent'; });
  document.getElementById('ws-color').value = WS_COLORS[i];
}

    var blkFields = document.getElementById("blocker-fields");

    if (hasBlk) {
      var what = document.getElementById("tu-blk-what").value.trim();
      var who = document.getElementById("tu-blk-who").value.trim();
      if (!what||!who) { alert("Please fill in the blocker details"); return; }
      blocker = { what:what, who:who, by:document.getElementById("tu-blk-by").value, active:true };
    }
    if (isEdit) {
      if (!ex.versions) ex.versions = [];
      ex.versions.unshift({ savedAt:new Date().toISOString(), submittedBy:ex.submittedBy, status:ex.status, whereItsUp:ex.whereItsUp, completed:ex.completed, nextAction:ex.nextAction, blocker:ex.blocker, followUp:ex.followUp });
      ex.editedAt = new Date().toISOString(); ex.status=statusVal; ex.whereItsUp=where;
      ex.completed=document.getElementById("tu-completed").value.trim();
      ex.nextAction=document.getElementById("tu-next").value.trim();
      ex.followUp=document.getElementById("tu-followup").value;
      ex.submittedBy=(document.getElementById("tu-by")?document.getElementById("tu-by").value.trim():currentUserName())||currentUserName();
      if (blocker) ex.blocker=blocker;
    } else {
      var newUpd = { id:"upd"+Date.now(), submittedAt:new Date().toISOString(), submittedBy:(document.getElementById("tu-by")?document.getElementById("tu-by").value.trim():currentUserName())||currentUserName(), status:statusVal, whereItsUp:where, completed:document.getElementById("tu-completed").value.trim(), nextAction:document.getElementById("tu-next").value.trim(), followUp:document.getElementById("tu-followup").value, blocker:blocker, versions:[] };
      if (!p.updates) p.updates=[];
      p.updates.unshift(newUpd);
      if (blocker) {
        var iTask = { id:"it"+Date.now(), title:"Issue: "+blocker.what.slice(0,50), status:"in-progress", owner:blocker.who, due:blocker.by||"", isIssue:true, linkedProjectId:p.id, actions:[], updates:[], captures:[], deferrals:0 };
        p.tasks.push(iTask); blocker.issueTaskId=iTask.id; newUpd.blocker=blocker;
        p.blocker={ active:true, what:blocker.what, who:blocker.who, by:blocker.by, issueTaskId:iTask.id };
      }
    }
    p.status=statusVal==="done"?"done":statusVal==="active"?"active":statusVal;
    p.whereItsAt=where;
    p.nextStep=document.getElementById("tu-next").value.trim()||p.nextStep;
    p.nextTouch=document.getElementById("tu-followup").value||p.nextTouch;

    if (statusVal!=="blocked" && p.blocker) p.blocker.active=false;
    logChange(isEdit?'Update edited':'Update submitted', p.name + ' — ' + statusVal);
    p.lastUpdated=today();
    closeModal(); notify(isEdit?"Update saved":"Update added");

}

function addInboxItem() {
  var input = document.getElementById('inbox-text');
  if (!input) return;
  var text = input.value.trim();
  if (!text) return;
  if (!data.inbox) data.inbox = [];
  data.inbox.unshift({ id:'i'+Date.now(), text: text, createdAt: new Date().toISOString() });
  input.value = '';
  closeModal();
  notify('Captured to inbox');
  renderSidebar();
}

function processInboxItem(index, type) {
  var item = (data.inbox||[])[index];
  if (!item) return;
  closeModal();
  if (type === 'project') {
    data.inbox.splice(index, 1);
    openAddProject();
  } else if (type === 'task') {
    data.inbox.splice(index, 1);
    openAddAction();
  } else {
    data.inbox.splice(index, 1);
    notify('Item noted and dismissed');
    renderSidebar();
  }
}

function dismissInboxItem(index) {
  (data.inbox||[]).splice(index, 1);
  closeModal();
  notify('Dismissed');
  renderSidebar();
  openInbox();
}


// ── HELPERS: UPDATES & ISSUES ────────────────────────────────────────────────
function allIssues() {
  var results = [];
  data.projects.forEach(function(p) {
    p.tasks.forEach(function(t) {
      if (t.isIssue && t.status !== 'complete') results.push({ task:t, project:p });
      else if (t.blocker && t.blocker.active) results.push({ task:t, project:p, isBlocker:true });
    });
  });
  return results;
}

function latestUpdate(task) {
  var u = task.updates || [];
  return u.length ? u[0] : null;
}

function derivedTaskSummary(task) {
  var u = latestUpdate(task);
  if (u && u.whereItsUp) return u.whereItsUp;
  var done = (task.actions||[]).filter(function(a){return a.status==='complete';});
  if (done.length) return done.length + ' action(s) completed. Latest: ' + done[0].title + '.';
  return 'No updates yet.';
}

function taskNextActionText(task) {
  var u = latestUpdate(task);
  if (u && u.nextAction) return u.nextAction;
  var a = (task.actions||[]).find(function(a){return a.status==='pending';});
  return a ? a.title + ' (' + fmtDate(a.scheduled) + ')' : '';
}

    html += '<div style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">\u26a0\ufe0f Blocked</div>';
    html += '<div style="font-size:13px;color:#7f1d1d;font-weight:500">' + blocker.what + '</div>';
    html += '<div style="font-size:12px;color:var(--text-sub);margin-top:4px">Owner: ' + blocker.who + (blocker.by ? ' \u00b7 Resolve by ' + fmtDate(blocker.by) : '') + '</div>';
    if (issueTask) html += '<div style="margin-top:8px"><button onclick="openTask(\'' + p.id + '\',\'' + issueTask.id + '\')" style="background:var(--red-light);border:1px solid #fecaca;color:var(--red);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">\u2192 Open Issue Task: ' + issueTask.title + '</button></div>';
    html += '<div style="margin-top:8px"><button onclick="resolveBlocker(\'' + p.id + '\',\'' + t.id + '\')" style="background:var(--green-light);border:1px solid #bbf7d0;color:var(--green);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">\u2713 Mark Resolved</button></div>';
    html += '</div>';
  }

  // Derived summary
  html += '<div class="derived-box" style="margin-top:14px">';
  html += '<div class="derived-label">\u26a1 Where it\'s up to</div>';
  html += '<div class="derived-text">' + derivedTaskSummary(t) + '</div>';
  var nxt = taskNextActionText(t);
  if (nxt) html += '<div style="margin-top:8px;font-size:12px;color:#1e40af;font-weight:500">\u2192 Next: ' + nxt + '</div>';
  html += '</div>';
  html += '</div>';

  // Tabs
  html += '<div class="tabs" style="margin-bottom:16px">';
  html += '<button class="tab active" data-ttab="actions" onclick="setTaskTab(this,\'actions\')">Actions</button>';
  html += '<button class="tab" data-ttab="updates" onclick="setTaskTab(this,\'updates\')">Updates</button>';
  html += '<button class="tab" data-ttab="info" onclick="setTaskTab(this,\'info\')">Notes / Links</button>';
  html += '</div>';
  html += '<div id="task-tab-content"></div>';

  html += '</div>'; // close flex:1 overflow:hidden row
  html += '</div>'; // close outer column
  document.getElementById('main-content').style.padding = '0';
  document.getElementById('main-content').innerHTML = html;
  renderTaskTab('actions');
}

function setTaskTab(btn, tab) {
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderTaskTab(tab);
}

function renderTaskTab(tab) {
  var t = currentTask; var p = currentProject;
  var el = document.getElementById('task-tab-content');
  if (!el || !t) return;

  if (tab === 'actions') {
    var openA = (t.actions||[]).filter(function(a){return a.status==='pending';});
    var doneA = (t.actions||[]).filter(function(a){return a.status==='complete';}).sort(function(a,b){return (b.completedAt||'').localeCompare(a.completedAt||'');});
    var html = '';
    if (t.status !== 'complete') {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
      html += '<div style="font-size:11px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:1px">Open Actions</div>';
      html += '<button onclick="openAddActionForTask(\'' + p.id + '\',\'' + t.id + '\')" class="btn-ghost" style="font-size:12px">+ Add</button></div>';
    }
    if (openA.length) {
      html += '<div class="card" style="padding:6px 18px;margin-bottom:16px">';
      openA.forEach(function(a) {
        html += '<div class="action-row">';
        html += '<div class="action-icon" style="background:' + actionBg(a.type) + '">' + actionIcon(a.type) + '</div>';
        html += '<div style="flex:1;min-width:0"><div class="action-title">' + a.title + '</div>';
        html += '<div class="action-meta">' + a.type + ' \u00b7 ' + fmtEst(a.est) + ' \u00b7 ' + fmtDate(a.scheduled) + ' \u00b7 ' + a.owner + '</div>';
        if (a.deferCount) html += '<div style="font-size:10px;color:var(--amber);margin-top:2px">\u26a0 Deferred ' + a.deferCount + 'x</div>';
        html += '</div><div style="display:flex;gap:4px">';
        html += '<button onclick="completeAction(\'' + p.id + '\',\'' + t.id + '\',\'' + a.id + '\')" style="background:var(--green-light);border:1px solid #bbf7d0;color:var(--green);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">Done</button>';
        html += '<button onclick="deferAction(\'' + p.id + '\',\'' + t.id + '\',\'' + a.id + '\')" style="background:var(--amber-light);border:1px solid #fde68a;color:var(--amber);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">Defer</button>';
        html += '</div></div>';
      });
      html += '</div>';
    } else if (t.status !== 'complete') {
      html += '<div class="card" style="padding:20px;text-align:center;color:var(--text-dim);margin-bottom:16px"><div style="font-size:12px">No open actions \u2014 add one to keep this moving</div></div>';
    }
    if (doneA.length) {
      html += '<details class="card" style="padding:10px 18px"><summary style="cursor:pointer;font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px">Completed (' + doneA.length + ')</summary><div style="margin-top:10px">';
      doneA.forEach(function(a) {
        html += '<div class="action-row" style="align-items:flex-start">';
        html += '<div class="action-icon" style="background:#ecfdf5">\u2713</div>';
        html += '<div style="flex:1;min-width:0"><div class="action-title" style="color:var(--text-sub)">' + a.title + '</div>';
        html += '<div class="action-meta">' + a.type + ' \u00b7 ' + fmtDate(a.completedAt) + (a.completedBy?' \u00b7 '+a.completedBy:'') + '</div>';
        if (a.completionNote) html += '<div style="font-size:12px;color:var(--text-sub);margin-top:4px">' + a.completionNote + '</div>';
        html += '</div><span class="tag tag-green">Done</span></div>';
      });
      html += '</div></details>';
    }
    if (!openA.length && !doneA.length) html += '<div class="empty" style="margin-top:40px"><div class="empty-icon">\u26a1</div><div class="empty-text">No actions yet</div></div>';
    el.innerHTML = html;

  } else if (tab === 'updates') {
    var updates = t.updates || [];
    var sColors = {active:'var(--green)','at-risk':'var(--amber)',stuck:'var(--red)',blocked:'var(--red)',done:'var(--text-dim)'};
    var sEmoji = {active:'\ud83d\udfe2','at-risk':'\ud83d\udfe1',stuck:'\ud83d\udd34',blocked:'\ud83d\udd34',done:'\u2705'};
    var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
    html += '<div style="font-size:11px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:1px">Update History</div>';
    if (t.status !== 'complete') html += '<button onclick="openTaskUpdateForm(\'' + p.id + '\',\'' + t.id + '\')" class="btn-primary" style="font-size:12px">+ New Update</button>';
    html += '</div>';
    if (updates.length) {
      html += '<div class="card">';
      updates.forEach(function(u) {
        html += '<div class="update-item">';
        html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">';
        html += '<div style="display:flex;align-items:center;gap:8px">';
        html += '<span style="font-size:14px">' + (sEmoji[u.status]||'\ud83d\udfe2') + '</span>';
        html += '<span style="font-size:12px;font-weight:600;color:' + (sColors[u.status]||'var(--green)') + '">' + statusLabel(u.status) + '</span>';
        html += '<span style="font-size:11px;color:var(--text-dim)">' + (u.submittedBy||'Me') + ' \u00b7 ' + fmtDate(u.submittedAt) + '</span>';
        if (u.editedAt) html += '<span style="font-size:10px;color:var(--text-dim);font-style:italic">edited ' + fmtDate(u.editedAt) + '</span>';
        html += '</div><div style="display:flex;gap:6px">';
        html += '<button onclick="editTaskUpdate(\'' + p.id + '\',\'' + t.id + '\',\'' + u.id + '\')" style="background:none;border:1px solid var(--border);color:var(--text-sub);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit">Edit</button>';
        html += '<button onclick="deleteTaskUpdate(\'' + p.id + '\',\'' + t.id + '\',\'' + u.id + '\')" style="background:none;border:1px solid var(--border);color:var(--red);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit">Delete</button>';
        html += '</div></div>';
        if (u.whereItsUp) html += '<div style="font-size:13px;color:var(--text);line-height:1.5;margin-bottom:6px">' + u.whereItsUp + '</div>';
        if (u.completed) html += '<div style="font-size:12px;color:var(--green);margin-bottom:4px">\u2713 Completed: ' + u.completed + '</div>';
        if (u.nextAction) html += '<div style="font-size:12px;color:var(--accent);margin-bottom:4px">\u2192 Next: ' + u.nextAction + '</div>';
        if (u.blocker) {
          html += '<div style="font-size:12px;color:var(--red);margin-bottom:4px">\u26a0 Blocked: ' + u.blocker.what + ' \u00b7 ' + u.blocker.who;
          if (u.blocker.issueTaskId) html += ' \u00b7 <button onclick="openTask(\'' + p.id + '\',\'' + u.blocker.issueTaskId + '\')" style="background:none;border:none;color:var(--accent);cursor:pointer;font-family:inherit;font-size:12px;padding:0">Issue Task \u2192</button>';
          html += '</div>';
        }
        if (u.followUp) html += '<div style="font-size:11px;color:var(--text-dim)">Follow up: ' + fmtDate(u.followUp) + '</div>';
        if (u.versions && u.versions.length) {
          html += '<details style="margin-top:8px"><summary style="font-size:11px;color:var(--text-dim);cursor:pointer">Version history (' + u.versions.length + ')</summary><div style="margin-top:8px;padding:8px;background:#f9fafb;border-radius:6px">';
          u.versions.forEach(function(v) {
            html += '<div style="font-size:11px;color:var(--text-sub);padding:4px 0;border-bottom:1px solid var(--border)">' + fmtDate(v.savedAt) + ' \u00b7 ' + (v.submittedBy||'Me') + ': ' + (v.whereItsUp||'').slice(0,60) + ((v.whereItsUp||'').length>60?'\u2026':'') + '</div>';
          });
          html += '</div></details>';
        }
        html += '</div>';
      });
      html += '</div>';
    } else {
      html += '<div class="empty" style="margin-top:40px"><div class="empty-icon">\ud83d\udcdd</div><div class="empty-text">No updates yet</div></div>';
    }
    el.innerHTML = html;

  } else if (tab === 'info') {
    var fakeProj = { id:t.id, name:t.title, tasks:[], captures:t.captures||[] };
    el.innerHTML = renderProjectInfoHub(fakeProj);
  }
}

// ── TASK UPDATE FORM ─────────────────────────────────────────────────────────
function openTaskUpdateForm(projId, taskId, editId) {
  var p = data.projects.find(function(x){return x.id===projId;});
  var t = p && p.tasks.find(function(x){return x.id===taskId;});
  if (!t) return;
  var ex = editId ? (t.updates||[]).find(function(u){return u.id===editId;}) : null;
  var isEdit = !!ex; ex = ex || {};

  var statuses = [
    {v:'active',l:'\ud83d\udfe2 On Track',c:'selected-green'},
    {v:'at-risk',l:'\ud83d\udfe1 At Risk',c:'selected-amber'},
    {v:'stuck',l:'\ud83d\udd34 Stuck',c:'selected-red'},
    {v:'blocked',l:'\ud83d\udeab Blocked',c:'selected-red'},
    {v:'done',l:'\u2705 Done',c:'selected-gray'}
  ];
  var curStatus = ex.status || t.status || 'active';
  var hasBlocker = !!(ex.blocker);

  var body = '<div class="form-group"><label class="form-label">Status</label><div class="status-pills">';
  statuses.forEach(function(s){
    var sel = curStatus===s.v ? s.c : '';
    body += '<button class="status-pill ' + sel + '" onclick="selectTaskStatus(this,\'' + s.v + '\')">' + s.l + '</button>';
  });
  body += '</div><input type="hidden" id="tu-status" value="' + curStatus + '"></div>';

  body += '<div class="form-group"><label class="form-label">Where it\'s up to <span style="color:var(--red)">*</span></label>';
  body += '<textarea class="form-textarea" id="tu-where" placeholder="What happened? Where does this stand now?">' + (ex.whereItsUp||'') + '</textarea></div>';

  body += '<div class="form-group"><label class="form-label">What\'s been completed (optional)</label>';
  body += '<input class="form-input" id="tu-completed" value="' + (ex.completed||'') + '" placeholder="Key things finished since last update"></div>';

  body += '<div class="form-group"><label class="form-label">Next action</label>';
  body += '<input class="form-input" id="tu-next" value="' + (ex.nextAction||'') + '" placeholder="What moves this forward?"></div>';

  body += '<div class="form-group"><label class="form-label">Blocking issue</label>';
  body += '<div style="display:flex;gap:8px;margin-bottom:8px">';
  body += '<button id="blk-no" onclick="toggleBlocker(false)" style="flex:1;padding:7px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid ' + (hasBlocker?'var(--border)':'var(--accent)') + ';background:' + (hasBlocker?'white':'var(--accent-light)') + ';color:' + (hasBlocker?'var(--text-sub)':'var(--accent)') + '">No blocker</button>';
  body += '<button id="blk-yes" onclick="toggleBlocker(true)" style="flex:1;padding:7px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid ' + (hasBlocker?'var(--red)':'var(--border)') + ';background:' + (hasBlocker?'var(--red-light)':'white') + ';color:' + (hasBlocker?'var(--red)':'var(--text-sub)') + '">\u26a0 Blocked</button>';
  body += '</div>';
  body += '<div id="blocker-fields" style="display:' + (hasBlocker?'block':'none') + ';background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px">';
  body += '<div class="form-group" style="margin-bottom:10px"><label class="form-label" style="color:var(--red)">What is blocking it</label>';
  body += '<textarea class="form-textarea" id="tu-blk-what" style="min-height:55px" placeholder="Describe the blocker">' + (ex.blocker&&ex.blocker.what||'') + '</textarea></div>';
  body += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  body += '<div class="form-group" style="margin-bottom:0"><label class="form-label" style="color:var(--red)">Who resolves it</label><input class="form-input" id="tu-blk-who" value="' + (ex.blocker&&ex.blocker.who||'') + '" placeholder="Name or role"></div>';
  body += '<div class="form-group" style="margin-bottom:0"><label class="form-label" style="color:var(--red)">Resolve by</label><input type="date" class="form-input" id="tu-blk-by" value="' + (ex.blocker&&ex.blocker.by||'') + '"></div>';
  body += '</div>';
  if (!isEdit) body += '<div style="font-size:11px;color:var(--red);margin-top:8px;font-weight:500">\u2192 An Issue Task will be created automatically</div>';
  body += '</div></div>';

  body += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
  body += '<div class="form-group"><label class="form-label">Follow-up date</label><input type="date" class="form-input" id="tu-followup" value="' + (ex.followUp||'') + '"></div>';
  body += '<div class="form-group"><label class="form-label">Submitted by</label><input class="form-input" id="tu-by" value="'+ currentUserName() +'" readonly style="background:#f9fafb;color:var(--text-sub)"></div>';
  body += '</div>';

  openModal(isEdit ? 'Edit Update' : 'Task Update', body, function() {
    var where = document.getElementById('tu-where').value.trim();
    if (!where) { alert('Please describe where this task is up to'); return; }
    var statusVal = document.getElementById('tu-status').value;
    var blkFields = document.getElementById('blocker-fields');
    var hasBlk = blkFields && blkFields.style.display !== 'none';
    var blocker = null;
    if (hasBlk) {
      var what = document.getElementById('tu-blk-what').value.trim();
      var who = document.getElementById('tu-blk-who').value.trim();
      if (!what || !who) { alert('Please fill in the blocker details'); return; }
      blocker = { what:what, who:who, by:document.getElementById('tu-blk-by').value, active:true };
    }

    if (isEdit) {
      if (!ex.versions) ex.versions = [];
      ex.versions.unshift({ savedAt:new Date().toISOString(), submittedBy:ex.submittedBy, status:ex.status, whereItsUp:ex.whereItsUp, completed:ex.completed, nextAction:ex.nextAction, blocker:ex.blocker, followUp:ex.followUp });
      ex.editedAt = new Date().toISOString();
      ex.status = statusVal; ex.whereItsUp = where;
      ex.completed = document.getElementById('tu-completed').value.trim();
      ex.nextAction = document.getElementById('tu-next').value.trim();
      ex.followUp = document.getElementById('tu-followup').value;
      ex.submittedBy = document.getElementById('tu-by').value.trim() || currentUserName();
      if (blocker) ex.blocker = blocker;
    } else {
      var newUpd = {
        id: 'upd'+Date.now(), submittedAt:new Date().toISOString(),
        submittedBy: document.getElementById('tu-by').value.trim() || currentUserName(),
        status: statusVal, whereItsUp: where,
        completed: document.getElementById('tu-completed').value.trim(),
        nextAction: document.getElementById('tu-next').value.trim(),
        followUp: document.getElementById('tu-followup').value,
        blocker: blocker, versions: []
      };
      if (!t.updates) t.updates = [];
      t.updates.unshift(newUpd);
      if (blocker) {
        var issueTask = {
          id:'it'+Date.now(), title:'Issue: '+blocker.what.slice(0,50),
          status:'in-progress', owner:blocker.who, due:blocker.by||'',
          isIssue:true, linkedTaskId:t.id, actions:[], updates:[], captures:[], deferrals:0
        };
        p.tasks.push(issueTask);
        blocker.issueTaskId = issueTask.id;
        newUpd.blocker = blocker;
        t.blocker = { active:true, what:blocker.what, who:blocker.who, by:blocker.by, issueTaskId:issueTask.id };
      }
    }
    t.status = statusVal==='done'?'complete':statusVal==='active'?'in-progress':statusVal;
    if (statusVal !== 'blocked' && t.blocker) t.blocker.active = false;
    p.lastUpdated = today();
    closeModal();
    notify(isEdit ? 'Update saved' : 'Update added');
    if (currentTask) renderTaskDetail(); else render();
  }, isEdit ? 'Save Changes' : 'Submit Update');
}

function toggleBlocker(show) {
  var f = document.getElementById('blocker-fields'); if(f) f.style.display=show?'block':'none';
  var no=document.getElementById('blk-no'), yes=document.getElementById('blk-yes');
  if(no){no.style.background=show?'white':'var(--accent-light)';no.style.color=show?'var(--text-sub)':'var(--accent)';no.style.borderColor=show?'var(--border)':'var(--accent)';}
  if(yes){yes.style.background=show?'var(--red-light)':'white';yes.style.color=show?'var(--red)':'var(--text-sub)';yes.style.borderColor=show?'var(--red)':'var(--border)';}
}

function selectTaskStatus(btn, val) {
  document.querySelectorAll('.status-pills .status-pill').forEach(function(b){b.className='status-pill';});
  var map = {active:'selected-green','at-risk':'selected-amber',stuck:'selected-red',blocked:'selected-red',done:'selected-gray'};
  btn.className = 'status-pill ' + (map[val]||'selected-gray');
  document.getElementById('tu-status').value = val;
  if (val==='blocked') toggleBlocker(true);
}

function editTaskUpdate(projId, taskId, updateId) { openTaskUpdateForm(projId, taskId, updateId); }

function deleteTaskUpdate(projId, taskId, updateId) {
  if (!confirm('Delete this update? This cannot be undone.')) return;
  var p = data.projects.find(function(x){return x.id===projId;});
  var t = p && p.tasks.find(function(x){return x.id===taskId;});
  if (!t) return;
  t.updates = (t.updates||[]).filter(function(u){return u.id!==updateId;});
  notify('Update deleted');
  if (currentTask) renderTaskDetail();
}

function deleteProjectUpdate(projId, updateId) {
  if (!confirm("Delete this update?")) return;
  var p = data.projects.find(function(x){return x.id===projId;});
  if (!p) return;
  p.updates = (p.updates||[]).filter(function(u){return u.id!==updateId;});
  notify("Update deleted");
  if (currentProject) renderProjectDetail(); else render();
}

function resolveBlocker(projId, taskId) {
  var p = data.projects.find(function(x){return x.id===projId;});
  var t = p && p.tasks.find(function(x){return x.id===taskId;});
  if (!t || !t.blocker) return;
  t.blocker.active = false;
  if (t.status==='blocked') t.status='in-progress';
  p.lastUpdated = today();
  notify('Blocker resolved');
  if (currentTask) renderTaskDetail(); else render();
}

// ── ISSUES VIEW ──────────────────────────────────────────────────────────────
function renderIssues() {
  var blocked = [], issueTasks = [];
  (data.activeWorkspace ? data.projects.filter(function(p){return p.ws===data.activeWorkspace;}) : data.projects).forEach(function(p) {
    p.tasks.forEach(function(t) {
      if (t.blocker && t.blocker.active) blocked.push({task:t, project:p});
      if (t.isIssue && t.status!=='complete') issueTasks.push({task:t, project:p});
    });
  });

  var html = '';
  if (!blocked.length && !issueTasks.length) {
    html = '<div class="empty" style="margin-top:80px"><div class="empty-icon" style="font-size:36px">\u2705</div><div class="empty-text" style="font-size:14px;font-weight:500">No active issues</div><div style="font-size:12px;margin-top:6px">Blockers and issue tasks will appear here</div></div>';
  } else {
    if (blocked.length) {
      html += '<div style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">\ud83d\udd34 Blocked Tasks (' + blocked.length + ')</div>';
      html += '<div class="card" style="margin-bottom:20px;padding:6px 18px">';
      blocked.forEach(function(item) {
        var t=item.task, p_=item.project;
        html += '<div class="action-row" style="align-items:flex-start;cursor:pointer" onclick="openTask(\'' + p_.id + '\',\'' + t.id + '\')">';
        html += '<div style="width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;margin-top:5px"></div>';
        html += '<div style="flex:1;min-width:0"><div class="action-title">' + t.title + '</div>';
        html += '<div class="action-meta">' + p_.name + ' \u00b7 ' + ((getWS(p_.ws)||{}).name||'') + '</div>';
        if (t.blocker) html += '<div style="font-size:12px;color:var(--red);margin-top:3px">\u26a0 ' + t.blocker.what + ' \u00b7 ' + t.blocker.who + (t.blocker.by?' \u00b7 by '+fmtDate(t.blocker.by):'') + '</div>';
        html += '</div><button onclick="event.stopPropagation();resolveBlocker(\'' + p_.id + '\',\'' + t.id + '\')" style="background:var(--green-light);border:1px solid #bbf7d0;color:var(--green);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;flex-shrink:0">Resolve</button>';
        html += '</div>';

  html += '</div>'; // close flex:1 overflow:hidden row

}

function getWorkDayActions(dayKey) {
  var today = new Date();
  var todayStr = today.toISOString().split('T')[0];
  var d = new Date(today);
  if (dayKey === 'tomorrow') d.setDate(d.getDate()+1);
  else if (dayKey === 'thisweek') { /* handled below */ }
  else if (dayKey === 'nextweek') { /* handled below */ }

  var allPending = activeProjects().flatMap(function(p) {
    return p.tasks.flatMap(function(t) {
      return (t.actions||[]).filter(function(a){ return a.status==='pending'; })
        .map(function(a){ return Object.assign({},a,{projectName:p.name,projectId:p.id,taskId:t.id,taskTitle:t.title}); });
    });
  });

  if (dayKey === 'today') {
    return allPending.filter(function(a){ return a.scheduled <= todayStr; });
  }
  if (dayKey === 'tomorrow') {
    var tmr = new Date(today); tmr.setDate(tmr.getDate()+1);
    var tmrStr = tmr.toISOString().split('T')[0];
    return allPending.filter(function(a){ return a.scheduled === tmrStr; });
  }
  if (dayKey === 'thisweek') {
    var weekEnd = new Date(today); weekEnd.setDate(weekEnd.getDate()+7);
    var weStr = weekEnd.toISOString().split('T')[0];
    return allPending.filter(function(a){ return a.scheduled > todayStr && a.scheduled <= weStr; });
  }
  if (dayKey === 'nextweek') {
    var nwStart = new Date(today); nwStart.setDate(nwStart.getDate()+8);
    var nwEnd = new Date(today); nwEnd.setDate(nwEnd.getDate()+14);
    var nwsStr = nwStart.toISOString().split('T')[0];
    var nweStr = nwEnd.toISOString().split('T')[0];
    return allPending.filter(function(a){ return a.scheduled >= nwsStr && a.scheduled <= nweStr; });
  }
  if (dayKey === 'unscheduled') {
    return allPending.filter(function(a){ return !a.scheduled || a.scheduled > new Date(today.getFullYear(), today.getMonth(), today.getDate()+14).toISOString().split('T')[0]; });
  }
  return [];
}

function getSortedActions(dayKey) {
  var actions = getWorkDayActions(dayKey);
  var sortOrder = (data.workSort && data.workSort[dayKey]) || [];
  if (!sortOrder.length) {
    // Default: timed actions first by time, then by scheduled date
    return actions.sort(function(a,b){
      var aTime = a.scheduledTime || '';
      var bTime = b.scheduledTime || '';
      if (aTime && !bTime) return -1;
      if (!aTime && bTime) return 1;
      if (aTime && bTime) return aTime.localeCompare(bTime);
      return (a.scheduled||'').localeCompare(b.scheduled||'') || (a.est||0)-(b.est||0);
    });
  }
  // Apply custom sort order
  var ordered = [], rest = [];
  sortOrder.forEach(function(id){ var a = actions.find(function(x){return x.id===id;}); if(a) ordered.push(a); });
  actions.forEach(function(a){ if(sortOrder.indexOf(a.id)===-1) rest.push(a); });
  return ordered.concat(rest);
}

function setWorkDay(day) {
  currentWorkDay = day;
  renderMyWork();
}

function moveActionToDay(actionId, fromDay, toDay) {
  // Find the action and update its scheduled date
  var today = new Date();
  var dateMap = {
    today: today,
    tomorrow: new Date(today.getFullYear(), today.getMonth(), today.getDate()+1),
    thisweek: new Date(today.getFullYear(), today.getMonth(), today.getDate()+3),
    nextweek: new Date(today.getFullYear(), today.getMonth(), today.getDate()+8)
  };
  var newDate = dateMap[toDay];
  if (!newDate) return;
  var newDateStr = newDate.toISOString().split('T')[0];
  data.projects.forEach(function(p){
    p.tasks.forEach(function(t){
      (t.actions||[]).forEach(function(a){
        if (a.id === actionId) a.scheduled = newDateStr;
      });
    });
  });
  notify('Moved to ' + toDay);
  renderMyWork();
}

function renderPlanWeek() {

  var td = new Date();

function quickAssignAction(actionId, projId, taskId) {

    var d=new Date(td); d.setDate(td.getDate()+i);

  }
  openModal('Schedule on which day?', opts, null, 'Cancel');
  document.getElementById('modal-footer').innerHTML = '<button class="btn-ghost" onclick="closeModal()">Cancel</button>';
}

function showAssignModal(dateStr) {
  var allPending = activeProjects().flatMap(function(p){ return p.tasks.flatMap(function(t){ return (t.actions||[]).filter(function(a){return a.status==='pending';}).map(function(a){return Object.assign({},a,{projectName:p.name,projectId:p.id,taskId:t.id});}); }); });
  var pool = allPending.filter(function(a){return !a.scheduled||a.scheduled<today();});
  if (!pool.length) { notify('No unscheduled actions'); return; }
  var d=new Date(dateStr+'T00:00:00'); var lbl=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
  var body='<div style="font-size:12px;color:var(--text-sub);margin-bottom:12px">Add to '+lbl+':</div>';
  pool.slice(0,8).forEach(function(a){ body+='<button onclick="assignActionToDay(&quot;'+a.id+'&quot;,&quot;'+a.projectId+'&quot;,&quot;'+a.taskId+'&quot;,&quot;'+dateStr+'&quot;)" style="background:var(--content-bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;text-align:left;font-size:12px;cursor:pointer;font-family:inherit;color:var(--text);display:block;width:100%;margin-bottom:5px"><div style="font-weight:500">'+a.title+'</div><div style="font-size:11px;color:var(--text-sub)">'+a.projectName+' &middot; '+fmtEst(a.est)+'</div></button>'; });

function assignActionToDay(actionId, projId, taskId, dateStr) {
  data.projects.forEach(function(p){p.tasks.forEach(function(t){(t.actions||[]).forEach(function(a){if(a.id===actionId)a.scheduled=dateStr;});});});
  closeModal(); notify('Scheduled');
  if (currentWorkDay==='planweek') renderPlanWeek(); else renderMyWork();
}

function shiftAction(actionId, days) {
  data.projects.forEach(function(p){p.tasks.forEach(function(t){(t.actions||[]).forEach(function(a){if(a.id===actionId){var d=new Date((a.scheduled||today())+'T00:00:00');d.setDate(d.getDate()+days);a.scheduled=d.toISOString().split('T')[0];}});});});
  notify(days>0?'Moved forward':'Moved back');
  if (currentWorkDay==='planweek') renderPlanWeek(); else renderMyWork();
}

function unscheduleAction(actionId) {
  data.projects.forEach(function(p){p.tasks.forEach(function(t){(t.actions||[]).forEach(function(a){if(a.id===actionId)a.scheduled='';});});});
  notify('Unscheduled');
  if (currentWorkDay==='planweek') renderPlanWeek(); else renderMyWork();
}

// ── DRAG TO REORDER QUEUE ────────────────────────────────────────────────────
window._dragId = null;
window._dropBefore = null; // id of item we'll insert BEFORE, or 'end'

function dragQueueStart(e, actionId) {
  window._dragId = actionId;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', actionId);
  setTimeout(function(){
    var el = document.getElementById('qi-'+actionId);
    if (el) { el.style.opacity = '0.35'; el.style.transform = 'scale(0.98)'; }
  }, 0);
}

function dragQueueOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  // Find which qi-* element we're over
  var target = e.target;
  while (target && target.id && !target.id.startsWith('qi-')) target = target.parentElement;
  if (!target || !target.id || !target.id.startsWith('qi-')) return;
  var targetId = target.id.replace('qi-', '');
  if (targetId === window._dragId) return;

  // Determine if cursor is in top or bottom half
  var rect = target.getBoundingClientRect();
  var mid = rect.top + rect.height / 2;
  var insertBefore = e.clientY < mid ? targetId : '__after__' + targetId;

  if (window._dropBefore === insertBefore) return; // no change
  window._dropBefore = insertBefore;

  // Remove all existing indicators
  document.querySelectorAll('.drag-indicator').forEach(function(el){ el.remove(); });
  document.querySelectorAll('[id^="qi-"]').forEach(function(el){
    el.style.marginTop = '';
    el.style.marginBottom = '';
  });

  // Show insertion line
  var line = document.createElement('div');
  line.className = 'drag-indicator';
  line.style.cssText = 'height:3px;background:#2563eb;border-radius:2px;margin:2px 0;box-shadow:0 0 6px rgba(37,99,235,0.5);';

  if (e.clientY < mid) {
    target.parentElement.insertBefore(line, target);
  } else {
    target.parentElement.insertBefore(line, target.nextSibling);
  }
}

function dragQueueDrop(e) {
  e.preventDefault();
  e.stopPropagation();

  // Clean up visual
  document.querySelectorAll('.drag-indicator').forEach(function(el){ el.remove(); });

  var dropBefore = window._dropBefore;
  var dragId = window._dragId;
  dragQueueEnd();

  if (!dragId || !dropBefore) return;

  var dayKey = currentWorkDay;
  var actions = getSortedActions(dayKey);
  var ids = actions.map(function(a){ return a.id; });

  var fromIdx = ids.indexOf(dragId);
  if (fromIdx === -1) return;

  // Remove dragged item
  ids.splice(fromIdx, 1);

  var insertBeforeId = dropBefore.startsWith('__after__')
    ? dropBefore.replace('__after__', '')
    : dropBefore;

  var toIdx = ids.indexOf(insertBeforeId);

  if (dropBefore.startsWith('__after__')) {
    ids.splice(toIdx + 1, 0, dragId);
  } else {
    if (toIdx === -1) ids.push(dragId);
    else ids.splice(toIdx, 0, dragId);
  }

  if (!data.workSort) data.workSort = {};
  data.workSort[dayKey] = ids;

  renderMyWork();
}

function dragQueueEnd() {
  window._dragId = null;
  window._dropBefore = null;
  document.querySelectorAll('.drag-indicator').forEach(function(el){ el.remove(); });
  document.querySelectorAll('[id^="qi-"]').forEach(function(el){
    el.style.opacity = '1';
    el.style.transform = '';
    el.style.marginTop = '';
    el.style.marginBottom = '';
  });
}


// ── ADD DROPDOWN ─────────────────────────────────────────────────────────────
function toggleAddDropdown() {
  var dd = document.getElementById('add-dropdown');
  if (!dd) return;
  var isOpen = dd.style.display !== 'none';
  dd.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) {
    // Close on outside click
    setTimeout(function() {
      document.addEventListener('click', closeOnOutside);
    }, 0);
  }
}

function closeOnOutside(e) {
  var wrap = document.getElementById('add-dropdown-wrap');
  if (wrap && !wrap.contains(e.target)) {
    closeAddDropdown();
    document.removeEventListener('click', closeOnOutside);
  }
}

function closeAddDropdown() {
  var dd = document.getElementById('add-dropdown');
  if (dd) dd.style.display = 'none';
  document.removeEventListener('click', closeOnOutside);
}

window.toggleProjectAdminOnly = function(projId) {
  if (!window.isAdmin) return;
  const p = (data.projects||[]).find(x => x.id === projId);
  if (!p) return;
  p.adminOnly = !p.adminOnly;
  window._localSave = true;
  if (window.scheduleSave) window.scheduleSave();
  notify(p.adminOnly ? 'Project set to admin only 🔒' : 'Project visible to everyone');
  renderAdminPanel();
};

// ── PATCH activeProjects to respect visibility ────────────────────────────────
function activeProjects() {
  const ws = data.activeWorkspace;
  const all = ws ? (data.projects||[]).filter(p=>p.ws===ws) : (data.projects||[]);
  if (window.isAdmin) return all;
  const me = currentUserName();
  return all.filter(p => {
    if (!p.adminOnly) return true;
    // Admin-only: only visible if user is assigned to the project or any task/action
    if (p.owner === me) return true;
    return (p.tasks||[]).some(t =>
      t.owner === me || (t.actions||[]).some(a => a.owner === me)
    );
  });
}

// Filter tasks within an admin-only project for non-admins
function visibleTasks(project, tasks) {
  if (window.isAdmin || !project.adminOnly) return tasks;
  const me = currentUserName();
  return tasks.filter(t =>
    t.owner === me || (t.actions||[]).some(a => a.owner === me)
  );
}

// Filter actions within a task for non-admins on admin-only projects
function visibleActions(project, task, actions) {
  if (window.isAdmin || !project.adminOnly) return actions;
  const me = currentUserName();
  return actions.filter(a => a.owner === me || task.owner === me);
}

var allActionsFilter = { project:'', owner:'', status:'', type:'', ws:'' };

function renderAllActions(f) {
  if (f) {
    if (f.project !== undefined) allActionsFilter.project = f.project;
    if (f.owner !== undefined) allActionsFilter.owner = f.owner;
    if (f.status !== undefined) allActionsFilter.status = f.status;
    if (f.type !== undefined) allActionsFilter.type = f.type;
    if (f.ws !== undefined) allActionsFilter.ws = f.ws;
  }
  document.getElementById('topbar-title').textContent = 'All Actions';
  document.getElementById('topbar-sub').textContent = 'Every action across all projects';
  var allProjects = window.isAdmin ? (data.projects||[]) : activeProjects();
  var users = signedInUsers().map(function(u){ return u.name||u.email; });
  var actionTypes = ['Call','Meeting','Research','Blocked Time','Follow Up','Other'];
  var actions = [];
  allProjects.forEach(function(p) {
    (p.tasks||[]).forEach(function(t) {
      (t.actions||[]).forEach(function(a) {
        actions.push({ id:a.id, title:a.title, type:a.type, est:a.est, scheduled:a.scheduled,
          owner:a.owner, status:a.status, completionNote:a.completionNote,
          projectName:p.name, projectId:p.id, taskId:t.id, taskTitle:t.title,
          wsId:p.ws, wsName:(getWS(p.ws)||{}).name||'', adminOnly:p.adminOnly });
      });
    });
  });
  if (allActionsFilter.project) actions = actions.filter(function(a){return a.projectId===allActionsFilter.project;});
  if (allActionsFilter.owner) actions = actions.filter(function(a){return a.owner===allActionsFilter.owner;});

  if (allActionsFilter.ws) actions = actions.filter(function(a){return a.wsId===allActionsFilter.ws;});
  actions.sort(function(a,b){
    var score = function(x){return x.status==='complete'?3:isPast(x.scheduled)&&!isToday(x.scheduled)?0:isToday(x.scheduled)?1:2;};
    return score(a)-score(b)||((a.scheduled||'').localeCompare(b.scheduled||''));
  });

  var wsOpts = (data.workspaces||[]).map(function(w){return '<option value="'+w.id+'"'+(allActionsFilter.ws===w.id?' selected':'')+'>'+w.name+'</option>';}).join('');
  var projOpts = allProjects.map(function(p){return '<option value="'+p.id+'"'+(allActionsFilter.project===p.id?' selected':'')+'>'+p.name+(p.adminOnly?' [Admin]':'')+' </option>';}).join('');
  var ownerOpts = users.map(function(u){return '<option value="'+u+'"'+(allActionsFilter.owner===u?' selected':'')+'>'+u+'</option>';}).join('');
  var typeOpts = actionTypes.map(function(t){return '<option value="'+t+'"'+(allActionsFilter.type===t?' selected':'')+'>'+t+'</option>';}).join('');

  var filterBar = '<div class="card" style="margin-bottom:16px;padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
    '<select class="form-select" style="width:auto;font-size:12px" onchange="renderAllActions({ws:this.value})"><option value="">All Workspaces</option>' + wsOpts + '</select>' +
    '<select class="form-select" style="width:auto;font-size:12px" onchange="renderAllActions({project:this.value})"><option value="">All Projects</option>' + projOpts + '</select>' +
    '<select class="form-select" style="width:auto;font-size:12px" onchange="renderAllActions({owner:this.value})"><option value="">All Owners</option>' + ownerOpts + '</select>' +
    '<select class="form-select" style="width:auto;font-size:12px" onchange="renderAllActions({status:this.value})"><option value="">All Statuses</option>' +
    '<option value="pending"'+(allActionsFilter.status==='pending'?' selected':'')+'>Pending</option>' +
    '<option value="complete"'+(allActionsFilter.status==='complete'?' selected':'')+'>Complete</option></select>' +
    '<select class="form-select" style="width:auto;font-size:12px" onchange="renderAllActions({type:this.value})"><option value="">All Types</option>' + typeOpts + '</select>' +
    '<button onclick="allActionsFilter={project:\'\',owner:\'\',status:\'\',type:\'\',ws:\'\'};renderAllActions()" style="background:none;border:1px solid var(--border);color:var(--text-sub);border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit">Clear</button>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--text-sub)">' + actions.length + ' action' + (actions.length!==1?'s':'') + '</span></div>';

  var rows = actions.map(function(a) {
    var overdue = a.status==='pending' && isPast(a.scheduled) && !isToday(a.scheduled);
    var todayA = isToday(a.scheduled);
    var dateLabel = overdue ? 'Overdue' : todayA ? 'Today' : a.status==='complete' ? 'Done' : fmtDate(a.scheduled);
    var dateColor = overdue ? 'var(--red)' : todayA ? 'var(--accent)' : 'var(--text-dim)';
    var doneBtn = a.status==='pending' ? ('<button onclick="completeAction(\''+a.projectId+'\',\''+a.taskId+'\',\''+a.id+'\')" style="background:var(--green-light);border:1px solid #bbf7d0;color:var(--green);border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">Done</button>') : '';
    return '<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="openActionCard(\''+a.projectId+'\',\''+a.taskId+'\',\''+a.id+'\')">' +
      '<div style="width:28px;height:28px;border-radius:7px;background:'+actionBg(a.type)+';display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">'+actionIcon(a.type)+'</div>' +
      '<div style="flex:1;min-width:0">' +
      '<div style="font-size:13px;font-weight:500;color:'+(a.status==='complete'?'var(--text-dim)':'var(--text)')+(a.status==='complete'?';text-decoration:line-through':'')+'">' +
      a.title+(a.adminOnly?' <span class="tag tag-red" style="font-size:10px">Admin</span>':'')+'</div>' +
      '<div style="font-size:11px;color:var(--text-dim);margin-top:2px">'+a.projectName+' &rarr; '+a.taskTitle+' &middot; '+fmtEst(a.est)+'</div></div>' +
      '<span style="font-size:11px;font-weight:600;color:'+dateColor+';flex-shrink:0">'+dateLabel+'</span>' +
      '<span class="tag tag-gray" style="flex-shrink:0;font-size:10px">&#128100; '+(a.owner||'&mdash;')+'</span>' +
      '<div style="display:flex;gap:4px;flex-shrink:0" onclick="event.stopPropagation()">' + doneBtn +
      '<button onclick="openEditAction(\''+a.projectId+'\',\''+a.taskId+'\',\''+a.id+'\')" style="background:none;border:1px solid var(--border);color:var(--text-sub);border-radius:5px;padding:2px 7px;font-size:11px;cursor:pointer;font-family:inherit">Edit</button>' +
      '<button onclick="deleteAction(\''+a.projectId+'\',\''+a.taskId+'\',\''+a.id+'\')" style="background:none;border:1px solid #fecaca;color:var(--red);border-radius:5px;padding:2px 7px;font-size:11px;cursor:pointer;font-family:inherit">Del</button>' +
      '</div></div>';
  }).join('');

  document.getElementById('main-content').innerHTML = filterBar +
    (actions.length ? '<div class="card" style="padding:0 16px">'+rows+'</div>' :
      '<div class="empty" style="margin-top:60px"><div class="empty-icon">&#9889;</div><div class="empty-text">No actions match this filter</div></div>');
}



// ── INIT ──────────────────────────────────────────────────────────────────────
ensureProjectDefaults();
// App starts hidden — Firebase auth will show it once logged in

// ── SAVE HOOK — patch all mutation functions to auto-save ─────────────────────
// We wrap the closeModal function to trigger save after any modal confirm
const _origCloseModal = closeModal;
window.closeModal = function() {
  _origCloseModal();
  window._localSave = true;
  if (window.scheduleSave) window.scheduleSave();
};

// Also patch toggleStep to save
const _origToggleStep = toggleStep;
window.toggleStep = function(id) {
  _origToggleStep(id);
  window._localSave = true;
  if (window.scheduleSave) window.scheduleSave();
};
</script>

<button id="fab-btn" onclick="toggleAddDropdown()" style="display:none;position:fixed;bottom:28px;right:28px;width:52px;height:52px;border-radius:50%;background:#2563eb;color:white;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(37,99,235,0.4);z-index:90;line-height:1;transition:transform 0.15s" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'" title="Add project, task, or action">+</button>
