        '</div>';
    }).join('');
    el.innerHTML = '<div style="padding-top:4px">'+cards+'</div>';
  }
}
// ── ACTIONS ────────────────────────────────────────────────────────────────────────────────
function openProject(id) {
  currentProject = data.projects.find(p=>p.id===id);
  currentTab = 'tasks';
  _selTaskId = null;
  renderProjectDetail();
}

function renderProjectDetail() {
  const p = currentProject;
  if (!p) return;
  document.getElementById('topbar-title').textContent = p.name;
  document.getElementById('topbar-sub').textContent = (getWS(p.ws)?.name||'') + ' workspace · Last updated ' + fmtDate(p.lastUpdated);
  ['dashboard','projects','actions','routine','waiting'].forEach(x=>document.getElementById('nav-'+x)?.classList.remove('active'));
  document.getElementById('nav-projects')?.classList.add('active');
  const mc = document.getElementById('main-content');
  mc.style.padding = '0';
  mc.classList.add('split-mode');
  mc.innerHTML = '<div class="proj-v2-shell" id="proj-v2-shell"></div>';
  _selTaskId = null;
  _taskViewMode = 'hybrid';
  _projChatOpen = true;
  renderProjV2(p);
}

// ── PROJECT DETAIL V2 STATE ────────────────────────────────────────────────
var _projChatOpen = true;
var _projChatTab = 'chat'; // 'chat' | 'activity'
var _projTab = 'hybrid';   // 'hybrid' | 'tasks' | 'actions'
var _expandedTasks = {};   // taskId -> bool

function renderProjV2(p) {
  const el = document.getElementById('proj-v2-shell');
  if (!el || !p) return;

  // Stats
  const allTasks = p.tasks || [];
  const openTasks = allTasks.filter(t => t.status !== 'complete').length;
  const allActions = allTasks.flatMap(t => t.actions || []);
  const openActions = allActions.filter(a => a.status === 'pending').length;
  const overdueActions = allActions.filter(a => a.status === 'pending' && isPast(a.scheduled) && !isToday(a.scheduled)).length;
  const dueToday = allActions.filter(a => a.status === 'pending' && isToday(a.scheduled)).length;
  const completedThisWeek = (() => {
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
    const cutStr = cutoff.toISOString().split('T')[0];
    return allActions.filter(a => a.status === 'complete' && (a.completedAt || '') >= cutStr).length;
  })();

  const nextAction = allActions.filter(a => a.status === 'pending').sort((a,b) => (a.scheduled||'9999').localeCompare(b.scheduled||'9999'))[0];
  const ws = getWS(p.ws);
  const wsColor = ws?.color || 'var(--accent)';

  el.innerHTML = `
    <div class="pv2-layout">
      <!-- LEFT: Main content -->
      <div class="pv2-main" id="pv2-main">

        <!-- Header strip -->
        <div class="pv2-header">
          <div class="pv2-header-top">
            <div style="display:flex;align-items:center;gap:10px;min-width:0">
              <button class="back-btn" style="margin:0;flex-shrink:0" onclick="setView('projects')">← Projects</button>
              <div style="min-width:0">
                <div style="font-size:16px;font-weight:700;color:var(--text);letter-spacing:-0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
                <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:3px">
                  <span class="${statusTag(p.status)}" style="font-size:10px">${statusLabel(p.status)}</span>
                  <span class="tag tag-gray" style="font-size:10px;background:${wsColor}18;color:${wsColor}">${ws?.name||''}</span>
                  ${p.department ? '<span class="tag tag-gray" style="font-size:10px;cursor:pointer" onclick="filterByDept(\''+p.department+'\')" title="Filter by department">'+deptName(p.department)+'</span>' : ''}
                  <span class="tag tag-gray" style="font-size:10px">👤 ${p.owner||'—'}</span>
                </div>
              </div>
            </div>
            <div style="display:flex;gap:6px;flex-shrink:0">
              <button onclick="openUpdateForm('${p.id}')" class="btn-primary" style="font-size:12px;padding:6px 12px">+ Update</button>
              <button onclick="openEditProject('${p.id}')" class="btn-ghost" style="font-size:12px">✏️</button>
              <button onclick="toggleProjChat()" class="btn-ghost" style="font-size:12px" id="chat-toggle-btn" title="Toggle chat">💬</button>
            </div>
          </div>

          <!-- Stat cards -->
          <div class="pv2-stats">
            <div class="pv2-stat">
              <div class="pv2-stat-num">${openTasks}</div>
              <div class="pv2-stat-label">Open Tasks</div>
            </div>
            <div class="pv2-stat">
              <div class="pv2-stat-num">${openActions}</div>
              <div class="pv2-stat-label">Open Actions</div>
            </div>
            <div class="pv2-stat pv2-stat-red" style="${overdueActions ? 'background:#fef2f2;border-color:#fecaca' : ''}">
              <div class="pv2-stat-num" style="color:${overdueActions ? 'var(--red)' : 'var(--text)'}">${overdueActions}</div>
              <div class="pv2-stat-label">Overdue</div>
            </div>
            <div class="pv2-stat">
              <div class="pv2-stat-num" style="color:${dueToday ? 'var(--accent)' : 'var(--text)'}">${dueToday}</div>
              <div class="pv2-stat-label">Due Today</div>
            </div>
            <div class="pv2-stat">
              <div class="pv2-stat-num" style="color:var(--green)">${completedThisWeek}</div>
              <div class="pv2-stat-label">Done This Week</div>
            </div>
          </div>

          <!-- Where it's up to strip -->
          ${p.whereItsAt ? `
          <div class="pv2-summary-strip">
            <span class="pv2-summary-label">⚡</span>
            <span class="pv2-summary-text">${p.whereItsAt}</span>
            ${nextAction ? '<span class="pv2-summary-sep">·</span><span class="pv2-summary-next">→ ' + nextAction.title + ' · ' + fmtDate(nextAction.scheduled) + '</span>' : ''}
          </div>` : ''}

          <!-- Tabs -->
          <div class="pv2-tabs">
            <button class="pv2-tab ${_projTab==='hybrid'?'active':''}" onclick="setProjTab('hybrid')">Hybrid</button>
            <button class="pv2-tab ${_projTab==='tasks'?'active':''}" onclick="setProjTab('tasks')">Tasks</button>
            <button class="pv2-tab ${_projTab==='actions'?'active':''}" onclick="setProjTab('actions')">Actions</button>
            <button class="pv2-tab ${_projTab==='updates'?'active':''}" onclick="setProjTab('updates')">Updates</button>
            <button class="pv2-tab ${_projTab==='notes'?'active':''}" onclick="setProjTab('notes')">Notes</button>
            <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
              <button onclick="openAddTaskForProject('${p.id}')" class="btn-primary" style="font-size:11px;padding:5px 10px">+ Task</button>
            </div>
          </div>
        </div>

        <!-- Tab body -->
        <div class="pv2-body" id="pv2-body"></div>
      </div>

      <!-- RIGHT: Chat panel -->
      <div class="pv2-chat-panel" id="pv2-chat-panel" style="display:${_projChatOpen?'flex':'none'}">
        <div class="pv2-chat-header">
          <div class="pv2-chat-tabs">
            <button class="pv2-chat-tab ${_projChatTab==='chat'?'active':''}" onclick="setProjChatTab('chat')">💬 Chat</button>
            <button class="pv2-chat-tab ${_projChatTab==='activity'?'active':''}" onclick="setProjChatTab('activity')">⚡ Activity</button>
          </div>
          <button onclick="toggleProjChat()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;padding:2px 6px;line-height:1">×</button>
        </div>
        <div class="pv2-chat-body" id="pv2-chat-body"></div>
        <div class="pv2-chat-input" id="pv2-chat-input"></div>
      </div>
    </div>
  `;

  renderProjTab(p);
  renderProjChat(p);
}

function setProjTab(tab) {
  _projTab = tab;
  const p = currentProject;
  document.querySelectorAll('.pv2-tab').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().toLowerCase() === tab || b.getAttribute('onclick') === "setProjTab('"+tab+"')");
  });
  renderProjTab(p);
}

function setProjChatTab(tab) {
  _projChatTab = tab;
  const p = currentProject;
  document.querySelectorAll('.pv2-chat-tab').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick') === "setProjChatTab('"+tab+"')");
  });
  renderProjChat(p);
}

function toggleProjChat() {
  _projChatOpen = !_projChatOpen;
  const panel = document.getElementById('pv2-chat-panel');
  const main  = document.getElementById('pv2-main');
  if (panel) panel.style.display = _projChatOpen ? 'flex' : 'none';
}

function renderProjTab(p) {
  const el = document.getElementById('pv2-body');
  if (!el || !p) return;
  const tasks = visibleTasks(p, [...p.tasks]).sort((a,b) => (a.status==='complete'?1:0)-(b.status==='complete'?1:0)||a.title.localeCompare(b.title));

  if (_projTab === 'hybrid') { el.innerHTML = buildHybridView(p, tasks); return; }
  if (_projTab === 'tasks')  { el.innerHTML = buildTasksView(p, tasks); return; }
  if (_projTab === 'actions'){ el.innerHTML = buildActionsView(p, tasks); return; }
  if (_projTab === 'updates'){ el.innerHTML = buildUpdatesView(p); return; }
  if (_projTab === 'notes')  { el.innerHTML = renderProjectInfoHub(p); return; }
}

// ── HYBRID VIEW ───────────────────────────────────────────────────────────────
function buildHybridView(p, tasks) {
  if (!tasks.length) return emptyTaskState(p);
  return tasks.map(t => buildHybridTaskCard(p, t)).join('');
}

function buildHybridTaskCard(p, t) {
  const openA  = visibleActions(p, t, (t.actions||[]).filter(a=>a.status==='pending'));
  const doneA  = (t.actions||[]).filter(a=>a.status==='complete').length;
  const totalA = (t.actions||[]).length;
  const pct    = totalA ? Math.round(doneA/totalA*100) : 0;
  const done   = t.status === 'complete';
  const blocker = t.blocker && t.blocker.active;
  const expanded = _expandedTasks[t.id] !== false && openA.length > 0; // default open if has actions
  const dotColor = done?'var(--green)':blocker?'var(--red)':t.status==='in-progress'?'var(--accent)':t.status==='at-risk'?'var(--amber)':'#9ca3af';
  const users = Object.values(data._users||{});
  const ownerUser = users.find(u => u.name===t.owner||u.email===t.owner);
  const ownerInitials = ownerUser ? (ownerUser.name||ownerUser.email||'?').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase() : (t.owner||'?').slice(0,2).toUpperCase();

  let html = '<div class="htc" style="border-color:'+( blocker?'#fecaca':done?'#bbf7d0':'var(--border)')+'">'; 

  // Task header row
  html += '<div class="htc-header" onclick="toggleTaskExpand(\''+t.id+'\')">';
  html += '<div class="htc-chevron" id="htc-chev-'+t.id+'">'+(expanded?'▾':'▸')+'</div>';
  html += '<div style="flex:1;min-width:0">';
  html += '<div style="display:flex;align-items:center;gap:7px">';
  html += '<div class="htc-dot" style="background:'+dotColor+'"></div>';
  html += '<span class="htc-title" onclick="event.stopPropagation();selectTaskPanel(\''+p.id+'\',\''+t.id+'\')">' + t.title + '</span>';
  if (t.isIssue) html += '<span class="tag tag-red" style="font-size:10px">Issue</span>';
  if (blocker)   html += '<span class="tag tag-red" style="font-size:10px">⚠ Blocked</span>';
  html += '</div>';
  html += '<div style="display:flex;gap:5px;margin-top:4px;align-items:center">';
  html += '<span class="'+statusTag(t.status)+'" style="font-size:10px">'+statusLabel(t.status)+'</span>';
  if (t.due) html += '<span class="tag tag-gray" style="font-size:10px">· Due '+fmtDate(t.due)+'</span>';
  html += '</div></div>';

  // Owner avatar
  html += '<div class="htc-avatar" title="'+( t.owner||'Unassigned')+'">'+ownerInitials+'</div>';

  // Progress + action count
  html += '<div class="htc-progress-wrap">';
  html += '<div style="font-size:11px;font-weight:600;color:var(--text-sub);text-align:right;margin-bottom:4px">'+pct+'% Complete</div>';
  html += '<div class="htc-progress-bar"><div class="htc-progress-fill" style="width:'+pct+'%;background:'+( pct===100?'var(--green)':'var(--accent)')+'"></div></div>';
  html += '<div style="font-size:10px;color:var(--text-dim);text-align:right;margin-top:3px">'+( done?'Complete':openA.length+' Open')+'</div>';
  html += '</div>';

  // Quick actions
  html += '<div class="htc-actions" onclick="event.stopPropagation()">';
  if (!done) {
    html += '<button onclick="openAddActionForTask(\''+p.id+'\',\''+t.id+'\')" class="htc-btn">+</button>';
    html += '<button onclick="completeTask(\''+p.id+'\',\''+t.id+'\')" class="htc-btn htc-btn-green">✓</button>';
  }
  html += '</div>';

  html += '</div>'; // end htc-header

  // Expanded action rows
  if (expanded) {
    html += '<div class="htc-actions-list" id="htc-list-'+t.id+'">';
    if (openA.length) {
      openA.forEach(a => {
        const overdue = isPast(a.scheduled) && !isToday(a.scheduled);
        const todayA  = isToday(a.scheduled);
        const aOwner  = users.find(u => u.name===a.owner||u.email===a.owner);
        const aInit   = aOwner ? (aOwner.name||'?').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase() : (a.owner||'?').slice(0,2).toUpperCase();
        html += '<div class="htc-action-row" onclick="openActionCard(\''+p.id+'\',\''+t.id+'\',\''+a.id+'\')">';
        html += '<div class="htc-action-check" onclick="event.stopPropagation();completeAction(\''+p.id+'\',\''+t.id+'\',\''+a.id+'\')" title="Complete"></div>';
        html += '<div style="width:30px;flex-shrink:0"></div>'; // indent
        html += '<div class="htc-action-icon">'+actionIcon(a.type)+'</div>';
        html += '<div style="flex:1;min-width:0"><div style="font-size:13px;color:var(--text);font-weight:500">'+a.title+'</div><div style="font-size:11px;color:var(--text-dim)">'+a.type+' · '+fmtEst(a.est)+'</div></div>';
        html += '<div class="htc-action-avatar" title="'+(a.owner||'')+'">'+aInit+'</div>';
        html += '<span class="htc-status-pill '+( overdue?'htc-pill-red':todayA?'htc-pill-blue':'htc-pill-gray')+'">'+( a.status==='complete'?'Done':overdue?'Overdue':todayA?'Today':statusLabel(a.status)||'Pending')+'</span>';
        html += '<span style="font-size:11px;color:'+(overdue?'var(--red)':todayA?'var(--accent)':'var(--text-dim)')+';min-width:50px;text-align:right">'+fmtDate(a.scheduled)+'</span>';
        html += '</div>';
      });
    } else {
      html += '<div style="padding:10px 16px 10px 48px;font-size:12px;color:var(--text-dim);font-style:italic">No open actions — <button onclick="openAddActionForTask(\''+p.id+'\',\''+t.id+'\')" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;font-family:inherit;padding:0">add one</button></div>';
    }
    html += '</div>';
  }

  html += '</div>'; // end htc
  return html;
}

function toggleTaskExpand(taskId) {
  _expandedTasks[taskId] = !(_expandedTasks[taskId] !== false);
  renderProjTab(currentProject);
}

function selectTaskPanel(projId, taskId) {
  // Open task in the chat panel right side as a detail view
  _selTaskId = taskId;
  const p = data.projects.find(x=>x.id===projId);
  const t = p?.tasks.find(x=>x.id===taskId);
  if (!t) return;
  const chatBody = document.getElementById('pv2-chat-body');
  const chatInput = document.getElementById('pv2-chat-input');
  if (!chatBody) return;
  _projChatOpen = true;
  document.getElementById('pv2-chat-panel').style.display = 'flex';
  // Show task detail in right panel
  renderTaskInChatPanel(p, t, chatBody, chatInput);
}

function renderTaskInChatPanel(p, t, chatBody, chatInput) {
  const openA = visibleActions(p, t, (t.actions||[]).filter(a=>a.status==='pending'));
  const done  = t.status === 'complete';
  chatBody.innerHTML = `
    <div style="padding:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <button onclick="renderProjChat(currentProject)" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;font-family:inherit;padding:0">← Project Chat</button>
      </div>
      <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px">${t.title}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
        <span class="${statusTag(t.status)}">${statusLabel(t.status)}</span>
        <span class="tag tag-gray" style="font-size:10px">👤 ${t.owner||'—'}</span>
        ${t.due?'<span class="tag '+(isPast(t.due)&&!done?'tag-red':'tag-gray')+'" style="font-size:10px">Due '+fmtDate(t.due)+'</span>':''}
      </div>
      <div style="font-size:11px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:6px">Open Actions</div>
      ${openA.length ? openA.map(a => {
        const ov = isPast(a.scheduled)&&!isToday(a.scheduled);
        return '<div onclick="openActionCard(\''+p.id+'\',\''+t.id+'\',\''+a.id+'\')" style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8fafc;border:1px solid var(--border);border-radius:7px;margin-bottom:5px;cursor:pointer">'
          +'<div style="width:20px;height:20px;border-radius:50%;border:1.5px solid '+(ov?'var(--red)':'var(--border)')+';cursor:pointer;flex-shrink:0" onclick="event.stopPropagation();completeAction(\''+p.id+'\',\''+t.id+'\',\''+a.id+'\')" title="Complete"></div>'
          +'<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:500">'+a.title+'</div><div style="font-size:10px;color:var(--text-dim)">'+fmtDate(a.scheduled)+'</div></div>'
          +'<span style="font-size:10px;color:'+(ov?'var(--red)':isToday(a.scheduled)?'var(--accent)':'var(--text-dim)')+'">'+( ov?'Overdue':isToday(a.scheduled)?'Today':fmtDate(a.scheduled))+'</span>'
          +'</div>';
      }).join('') : '<div style="font-size:12px;color:var(--text-dim);padding:8px 0">No open actions</div>'}
      <div style="display:flex;gap:6px;margin-top:12px">
        ${!done?'<button onclick="openAddActionForTask(\''+p.id+'\',\''+t.id+'\')" class="btn-ghost" style="font-size:11px">+ Action</button><button onclick="openTaskUpdateForm(\''+p.id+'\',\''+t.id+'\')" class="btn-ghost" style="font-size:11px">Update</button><button onclick="completeTask(\''+p.id+'\',\''+t.id+'\')" style="background:var(--green-light);border:1px solid #bbf7d0;color:var(--green);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">✓ Done</button>':''}
      </div>
    </div>
    <div style="border-top:1px solid var(--border);padding:12px 14px">
      <div style="font-size:11px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:8px">Task Comments</div>
      <div id="task-comments-list" style="font-size:12px;color:var(--text-dim)">Comments coming soon…</div>
    </div>
  `;
  if (chatInput) chatInput.innerHTML = buildChatInput(p.id, t.id);
}

// ── TASKS ONLY VIEW ───────────────────────────────────────────────────────────
function buildTasksView(p, tasks) {
  if (!tasks.length) return emptyTaskState(p);
  return '<div style="background:white;border:1px solid var(--border);border-radius:10px;overflow:hidden">'
    + '<div style="display:grid;grid-template-columns:1fr 80px 80px 50px 80px;gap:0;padding:8px 14px;background:#fafbfc;border-bottom:1px solid var(--border)">'
    + ['Task','Owner','Due','Actions','Status'].map(h=>'<div style="font-size:10px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:0.7px">'+h+'</div>').join('')
    + '</div>'
    + tasks.map(t => {
        const openA = (t.actions||[]).filter(a=>a.status==='pending').length;
        const done  = t.status==='complete';
        return '<div onclick="selectTaskPanel(\''+p.id+'\',\''+t.id+'\')" style="display:grid;grid-template-columns:1fr 80px 80px 50px 80px;gap:0;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.12s" onmouseover="this.style.background=\'#f8fafc\'" onmouseout="this.style.background=\'white\'">'
          +'<div style="display:flex;align-items:center;gap:7px;min-width:0"><div style="width:7px;height:7px;border-radius:50%;flex-shrink:0;background:'+(done?'var(--green)':t.status==='in-progress'?'var(--accent)':t.status==='at-risk'?'var(--amber)':'#9ca3af')+'"></div><span style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+t.title+'</span></div>'
          +'<div style="font-size:11px;color:var(--text-sub);align-self:center">'+(t.owner||'—')+'</div>'
          +'<div style="font-size:11px;color:'+(t.due&&isPast(t.due)&&!done?'var(--red)':'var(--text-dim)')+';align-self:center">'+(fmtDate(t.due)||'—')+'</div>'
          +'<div style="align-self:center"><span style="font-size:11px;background:#f3f4f6;color:var(--text-dim);border-radius:10px;padding:1px 7px;font-weight:600">'+(openA||'—')+'</span></div>'
          +'<div style="align-self:center"><span class="'+statusTag(t.status)+'" style="font-size:10px">'+statusLabel(t.status)+'</span></div>'
          +'</div>';
      }).join('')
    + '</div>';
}

// ── ACTIONS ONLY VIEW ─────────────────────────────────────────────────────────
function buildActionsView(p, tasks) {
  const allA = tasks.flatMap(t =>
    visibleActions(p, t, (t.actions||[]).filter(a=>a.status==='pending'))
      .map(a => Object.assign({}, a, {taskTitle:t.title, taskId:t.id}))
  ).sort((a,b) => (a.scheduled||'9999').localeCompare(b.scheduled||'9999'));
  if (!allA.length) return '<div style="text-align:center;padding:60px 20px;color:var(--text-dim)"><div style="font-size:28px;margin-bottom:10px">✅</div><div style="font-size:13px">No open actions</div></div>';
  return '<div style="background:white;border:1px solid var(--border);border-radius:10px;overflow:hidden">'
    + allA.map(a => {
        const ov = isPast(a.scheduled)&&!isToday(a.scheduled);
        const tod = isToday(a.scheduled);
        return '<div onclick="openActionCard(\''+p.id+'\',\''+a.taskId+'\',\''+a.id+'\')" style="display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.12s" onmouseover="this.style.background=\'#f8fafc\'" onmouseout="this.style.background=\'white\'">'
          +'<div style="width:28px;height:28px;border-radius:7px;background:'+actionBg(a.type)+';display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0">'+actionIcon(a.type)+'</div>'
          +'<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;color:var(--text)">'+a.title+'</div><div style="font-size:11px;color:var(--text-dim);margin-top:2px">'+a.taskTitle+' · '+fmtEst(a.est)+'</div></div>'
          +'<div style="font-size:11px;font-weight:600;color:'+(ov?'var(--red)':tod?'var(--accent)':'var(--text-dim)')+';flex-shrink:0">'+(ov?'Overdue':tod?'Today':fmtDate(a.scheduled))+'</div>'
          +'<div style="display:flex;gap:4px;flex-shrink:0" onclick="event.stopPropagation()">'
          +'<button onclick="completeAction(\''+p.id+'\',\''+a.taskId+'\',\''+a.id+'\')" style="background:var(--green-light);border:1px solid #bbf7d0;color:var(--green);border-radius:5px;padding:2px 7px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit">✓</button>'
          +'<button onclick="deferAction(\''+p.id+'\',\''+a.taskId+'\',\''+a.id+'\')" style="background:var(--amber-light);border:1px solid #fde68a;color:var(--amber);border-radius:5px;padding:2px 7px;font-size:10px;cursor:pointer;font-family:inherit">→</button>'
          +'</div></div>';
      }).join('')
    + '</div>';
}

// ── UPDATES VIEW ──────────────────────────────────────────────────────────────
function buildUpdatesView(p) {
  const pu = p.updates||[];
  const sc = {active:'var(--green)','at-risk':'var(--amber)',stuck:'var(--red)',blocked:'var(--red)',done:'var(--text-dim)'};
  let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  html += '<div style="font-size:12px;font-weight:600;color:var(--text-sub)">Update History</div>';
  html += '<button onclick="openUpdateForm(\''+p.id+'\')" class="btn-primary" style="font-size:11px;padding:5px 10px">+ New Update</button></div>';
  if (!pu.length) return html + '<div style="text-align:center;padding:40px;color:var(--text-dim)">No updates yet</div>';
  return html + pu.map(u => `
    <div style="background:white;border:1px solid var(--border);border-radius:9px;padding:14px 16px;margin-bottom:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;font-weight:700;color:${sc[u.status]||'var(--green)'}">●  ${statusLabel(u.status)}</span>
          <span style="font-size:11px;color:var(--text-dim)">${u.submittedBy||'Me'} · ${fmtDate(u.submittedAt)}</span>
        </div>
        <div style="display:flex;gap:4px">
          <button onclick="openUpdateForm('${p.id}','${u.id}')" style="background:none;border:1px solid var(--border);color:var(--text-sub);border-radius:5px;padding:2px 7px;font-size:10px;cursor:pointer;font-family:inherit">Edit</button>
          <button onclick="deleteProjectUpdate('${p.id}','${u.id}')" style="background:none;border:1px solid #fecaca;color:var(--red);border-radius:5px;padding:2px 7px;font-size:10px;cursor:pointer;font-family:inherit">Del</button>
        </div>
      </div>
      ${u.whereItsUp?'<div style="font-size:13px;color:var(--text);line-height:1.5;margin-bottom:6px">'+u.whereItsUp+'</div>':''}
      ${u.nextAction?'<div style="font-size:12px;color:var(--accent)">→ '+u.nextAction+'</div>':''}
    </div>`).join('');
}

function emptyTaskState(p) {
  return '<div style="text-align:center;padding:60px 20px;color:var(--text-dim)">'
    +'<div style="font-size:32px;margin-bottom:12px">📋</div>'
    +'<div style="font-size:14px;font-weight:500;margin-bottom:6px">No tasks yet</div>'
    +'<div style="font-size:12px;margin-bottom:16px">Break this project into tasks to track progress</div>'
    +'<button onclick="openAddTaskForProject(\''+p.id+'\')" class="btn-primary">+ Add First Task</button>'
    +'</div>';
}

// ── CHAT PANEL ────────────────────────────────────────────────────────────────
function renderProjChat(p) {
  const chatBody  = document.getElementById('pv2-chat-body');
  const chatInput = document.getElementById('pv2-chat-input');
  if (!chatBody || !chatInput) return;

  if (_projChatTab === 'activity') {
    renderActivityFeed(p, chatBody);
    chatInput.innerHTML = '';
    return;
  }

  // Chat tab
  const messages = (p.messages || []).sort((a,b) => (a.ts||'').localeCompare(b.ts||''));
  const me = currentUserName();
  const myEmail = window.currentUser ? window.currentUser.email : '';

  // Participants — everyone with access
  const allUsers = Object.values(data._users||{});
  const participants = allUsers.filter(u => {
    if (!u.email) return false;
    if (u.role==='admin') return true;
    if (p.owner === u.name || p.owner === u.email) return true;
    if ((p.assignees||[]).includes(u.email)) return true;
    if ((p.followers||[]).includes(u.email)) return true;
    if (p.department) {
      const myDepts = userDepartments(u.email);
      if (myDepts.includes(p.department)) return true;
    }
    return false;
  });

  let html = '';

  // Participant avatars
  if (participants.length) {
    html += '<div class="pv2-participants">';
    participants.slice(0,8).forEach(u => {
      const init = (u.name||u.email||'?').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
      html += '<div class="pv2-participant-avatar" title="'+( u.name||u.email)+'">' + init + '</div>';
    });
    if (participants.length > 8) html += '<div class="pv2-participant-avatar pv2-participant-more">+'+( participants.length-8)+'</div>';
    html += '</div>';
  }

  // Messages
  if (!messages.length) {
    html += '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:13px;text-align:center;padding:20px">No messages yet.<br>Start the conversation.</div>';
  } else {
    html += '<div class="pv2-messages" id="pv2-messages">';
    let lastDate = '';
    messages.forEach(m => {
      const isMe = m.senderEmail === myEmail || m.sender === me;
      const msgDate = m.ts ? m.ts.slice(0,10) : '';
      if (msgDate && msgDate !== lastDate) {
        html += '<div class="pv2-msg-date">'+fmtDate(msgDate)+'</div>';
        lastDate = msgDate;
      }
      const init = (m.sender||'?').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
      const timeStr = m.ts ? new Date(m.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
      if (isMe) {
        html += '<div class="pv2-msg-row pv2-msg-me">';
        html += '<div class="pv2-msg-wrap">';
        html += '<div class="pv2-msg-name pv2-msg-name-me">'+(m.sender||'You')+' (You)</div>';
        html += '<div class="pv2-bubble pv2-bubble-me">'+escHtml(m.text)+'</div>';
        html += '<div class="pv2-msg-time pv2-msg-time-me">'+timeStr+'</div>';
        html += '</div>';
        html += '<div class="pv2-msg-avatar pv2-msg-avatar-me">'+init+'</div>';
        html += '</div>';
      } else {
        html += '<div class="pv2-msg-row pv2-msg-other">';
        html += '<div class="pv2-msg-avatar">'+init+'</div>';
        html += '<div class="pv2-msg-wrap">';
        html += '<div class="pv2-msg-name">'+(m.sender||'?')+'</div>';
        html += '<div class="pv2-bubble pv2-bubble-other">'+escHtml(m.text)+'</div>';
        html += '<div class="pv2-msg-time">'+timeStr+'</div>';
        html += '</div>';
        html += '</div>';
      }
    });
    html += '</div>';
  }

  chatBody.innerHTML = html;

  // Scroll to bottom
  const msgs = document.getElementById('pv2-messages');
  if (msgs) msgs.scrollTop = msgs.scrollHeight;

  chatInput.innerHTML = buildChatInput(p.id, null);
}

function buildChatInput(projId, taskId) {
  var taskArg = taskId ? "'" + taskId + "'" : 'null';
  var pid = projId;
  return '<div style="position:relative">'
    +'<div id="pv2-mention-list" style="display:none;position:absolute;bottom:52px;left:0;right:0;background:white;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);z-index:99;max-height:160px;overflow-y:auto"></div>'
    +'<div class="pv2-input-row">'
    +'<input class="pv2-input" id="pv2-msg-inp" placeholder="Type a message… use @ to mention" '
    +'onkeydown="handleChatKey(event,&quot;'+pid+'&quot;,'+taskArg+')" '
    +'oninput="handleChatMention(this)">'
    +'<button onclick="sendProjMessage(&quot;'+pid+'&quot;,'+taskArg+')" class="pv2-send-btn">&#10148;</button>'
    +'</div>'
    +'</div>';
}


function handleChatKey(e, projId, taskId) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    var ml = document.getElementById('pv2-mention-list');
    if (ml && ml.style.display !== 'none' && ml.children.length) return;
    sendProjMessage(projId, taskId);
  }
  if (e.key === 'Escape') {
    var ml = document.getElementById('pv2-mention-list');
    if (ml) ml.style.display = 'none';
  }
}

function handleChatMention(inp) {
  var val = inp.value;
  var atIdx = val.lastIndexOf('@');
  var ml = document.getElementById('pv2-mention-list');
  if (!ml) return;
  if (atIdx === -1 || (val.length - atIdx > 25)) { ml.style.display = 'none'; return; }
  var query = val.slice(atIdx + 1).toLowerCase();
  var users = Object.values(data._users || {}).filter(function(u) {
    return (u.name||u.email||'').toLowerCase().indexOf(query) >= 0;
  }).slice(0, 6);
  if (!users.length) { ml.style.display = 'none'; return; }
  ml.style.display = 'block';
  ml.innerHTML = users.map(function(u) {
    var name = u.name || u.email || 'User';
    var init = name.split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
    return '<div onclick="insertMention(&quot;'+name+'&quot;)" style="display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:12px;color:var(--text)" onmouseover="this.style.background=&quot;#f3f4f6&quot;" onmouseout="this.style.background=&quot;white&quot;">'
      +'<div style="width:24px;height:24px;border-radius:50%;background:var(--accent);color:white;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+init+'</div>'
      +'<span>'+name+'</span>'
      +'</div>';
  }).join('');
}

function insertMention(name) {
  var inp = document.getElementById('pv2-msg-inp');
  var ml  = document.getElementById('pv2-mention-list');
  if (!inp) return;
  var val = inp.value;
  var atIdx = val.lastIndexOf('@');
  inp.value = val.slice(0, atIdx) + '@' + name + ' ';
  if (ml) ml.style.display = 'none';
  inp.focus();
}



function sendProjMessage(projId, taskId) {
  const inp = document.getElementById('pv2-msg-inp');
  if (!inp) return;
  const text = inp.value.trim();
  if (!text) return;
  const p = data.projects.find(x=>x.id===projId);
  if (!p) return;
  if (!p.messages) p.messages = [];
  const msg = {
    id: 'm'+Date.now(),
    text: text,
    sender: currentUserName(),
    senderEmail: window.currentUser ? window.currentUser.email : '',
    ts: new Date().toISOString(),
    taskId: taskId || null
  };
  p.messages.push(msg);
  logChange('Chat message', text.slice(0,50));
  window._localSave = true;
  if (window.scheduleSave) window.scheduleSave();
  inp.value = '';
  renderProjChat(p);
}

function escHtml(str) {
  if (!str) return '';
  var escaped = str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  // Highlight @mentions
  return escaped.replace(/@(\w[\w .]*)/g, '<span style="color:var(--accent);font-weight:600;background:rgba(37,99,235,0.1);border-radius:3px;padding:0 3px">@$1</span>');
}

// ── ACTIVITY FEED ─────────────────────────────────────────────────────────────
function renderActivityFeed(p, el) {
  const log = (data._auditLog||[]).filter(e => e.projectId === p.id || !e.projectId).slice(0,50);
  if (!log.length) {
    el.innerHTML = '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:13px;text-align:center;padding:20px">No activity yet</div>';
    return;
  }
  el.innerHTML = '<div style="padding:12px">'
    + log.map(e => '<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">'
      +'<div style="width:28px;height:28px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0">'+(e.who||'?').slice(0,2).toUpperCase()+'</div>'
      +'<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:500;color:var(--text)">'+( e.action||'')+'</div>'
      +'<div style="font-size:11px;color:var(--text-dim);margin-top:2px">'+(e.detail||'')+'</div>'
      +'<div style="font-size:10px;color:var(--text-dim);margin-top:2px">'+(e.who||'')+'  · '+fmtStamp(e.ts)+'</div></div></div>'
    ).join('')
    +'</div>';
}

function setTab(t) { setProjTab(t); }
function renderTab() { renderProjTab(currentProject); }


// ── ACTIONS ────────────────────────────────────────────────────────────────────────────────
function renderActions() {
  const td = todayActions();
  const upcoming = activeProjects().flatMap(p=>p.tasks.flatMap(t=>t.actions.filter(a=>a.status==='pending'&&a.scheduled>today()).map(a=>({...a,projectName:p.name,projectId:p.id,taskId:t.id,taskTitle:t.title}))));
  const done = completedActions();
  const showOpen = currentActionsFilter !== 'completed';
  const showCompleted = currentActionsFilter !== 'open';
  const filterBtn = (key, label, count) => `
    <button onclick="setActionFilter('${key}')" style="border:1px solid ${currentActionsFilter===key?'var(--accent)':'var(--border)'};background:${currentActionsFilter===key?'#eff6ff':'white'};color:${currentActionsFilter===key?'var(--accent)':'var(--text-sub)'};border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">${label} <span style="opacity:.72">${count}</span></button>`;
  document.getElementById('main-content').innerHTML = `
    <div class="card" style="margin-bottom:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div>
        <div style="font-size:13px;font-weight:700">Action view</div>
        <div style="font-size:12px;color:var(--text-sub)">Switch between open work and completed history without losing visibility.</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${filterBtn('open','Open', td.length + upcoming.length)}
        ${filterBtn('completed','Completed', done.length)}
        ${filterBtn('all','All', td.length + upcoming.length + done.length)}
      </div>
    </div>

    ${showOpen && td.length ? `
    <div style="margin-bottom:20px">
      <div style="font-size:11px;font-weight:600;color:var(--red);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Due Today · ${td.reduce((s,a)=>s+a.est,0)} min</div>
      <div class="card" style="padding:6px 18px">
        ${td.map(a=>`
          <div class="action-row">
            <div class="action-icon" style="background:${actionBg(a.type)}">${actionIcon(a.type)}</div>
            <div style="flex:1;min-width:0">
              <div class="action-title">${a.title}</div>
              <div class="action-meta">${a.projectName} · ${a.taskTitle} · ${fmtEst(a.est)} · ${a.owner}</div>
            </div>
            <span class="tag tag-gray">${a.type}</span>
            <button onclick="completeAction('${a.projectId}','${a.taskId}','${a.id}')" style="background:var(--green-light);border:1px solid #bbf7d0;color:var(--green);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;margin-left:6px">Done</button>
            <button onclick="deferAction('${a.projectId}','${a.taskId}','${a.id}')" style="background:var(--amber-light);border:1px solid #fde68a;color:var(--amber);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;margin-left:4px">Defer</button>
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    ${showOpen && upcoming.length ? `
    <div style="margin-bottom:20px">
      <div style="font-size:11px;font-weight:600;color:var(--text-sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Upcoming</div>
      <div class="card" style="padding:6px 18px">
        ${upcoming.map(a=>`
          <div class="action-row">
            <div class="action-icon" style="background:${actionBg(a.type)}">${actionIcon(a.type)}</div>
            <div style="flex:1;min-width:0">
              <div class="action-title">${a.title}</div>
              <div class="action-meta">${a.projectName} · ${a.taskTitle} · ${fmtEst(a.est)} · ${a.owner}</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <span class="tag tag-gray">${a.type}</span>
              <div style="font-size:10px;color:var(--text-dim);margin-top:4px">${fmtDate(a.scheduled)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    ${showCompleted && done.length ? `
    <details class="card" style="padding:10px 18px" ${currentActionsFilter==='completed' ? 'open' : ''}>

            </div>

}

// ── ROUTINE ───────────────────────────────────────────────────────────────────
function renderRoutine() {
  const rt = activeRoutines();
  const todayList = rt.filter(routineRunsToday);
  const laterList = rt.filter(r=>!routineRunsToday(r));
  const renderRoutineCard = (r) => {
    const done = r.steps.filter(s=>s.done).length;
    const pct = Math.round(done/r.steps.length*100);
    return `
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap">
          <div>
            <div style="font-size:15px;font-weight:600">${r.name}</div>
            <div style="font-size:12px;color:var(--text-sub);margin-top:2px">${routineClockTime(r)} · ${getWS(r.ws)?.name} · ${routineRepeatLabel(r)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <span class="tag ${routineRunsToday(r)?'tag-green':'tag-gray'}">${routineRunsToday(r)?'Scheduled today':'Later in cycle'}</span>
            <div style="text-align:right">
              <div style="font-size:20px;font-weight:700;color:${pct===100?'var(--green)':'var(--accent)'}">${pct}%</div>
              <div style="font-size:11px;color:var(--text-dim)">${done}/${r.steps.length} steps</div>
            </div>
          </div>
        </div>
        <div style="height:4px;background:var(--border);border-radius:2px;margin-bottom:14px">
          <div style="height:4px;background:${pct===100?'var(--green)':'var(--accent)'};border-radius:2px;width:${pct}%;transition:width 0.3s"></div>
        </div>
        ${r.steps.map(s=>`
          <div class="routine-row" onclick="toggleStep('${s.id}')">
            <div class="routine-check ${s.done?'done':'pending'}">${s.done?'✓':''}</div>
            <div class="routine-name ${s.done?'done':''}">${s.title}</div>
          </div>
        `).join('')}
      </div>
    `;
  };
  document.getElementById('main-content').innerHTML = `
    <div class="card" style="margin-bottom:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div>
        <div style="font-size:13px;font-weight:700">Repeating routines</div>
        <div style="font-size:12px;color:var(--text-sub)">Create routines that repeat daily, on weekdays, or on a chosen weekday with a set time and checklist.</div>
      </div>
      <button class="btn-primary" onclick="openAddRoutine()">+ Add Routine</button>
    </div>
    ${todayList.length ? `<div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Scheduled today</div>${todayList.map(renderRoutineCard).join('')}` : ''}
    ${laterList.length ? `<div style="font-size:11px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:1px;margin:8px 0 10px">Other repeating routines</div>${laterList.map(renderRoutineCard).join('')}` : ''}
    ${!todayList.length && !laterList.length ? '<div class="empty" style="margin-top:60px"><div class="empty-icon">↻</div><div class="empty-text">No routines for this workspace</div></div>' : ''}
  `;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function completeAction(projId, taskId, actionId) {
  const p = data.projects.find(x=>x.id===projId);
  const t = p?.tasks.find(x=>x.id===taskId);
  const a = t?.actions.find(x=>x.id===actionId);
  if (!a) return;
  openModal('Complete Action Item', `
    <div class="form-group">
      <label class="form-label">Completion Update</label>
      <textarea class="form-textarea" id="complete-note" placeholder="What happened, what was decided, or what finished?"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Completed By</label>
      <input class="form-input" id="complete-by" value="${currentUserName()}" readonly style="background:#f9fafb;color:var(--text-sub)">
    </div>
  `, ()=>{
    const note = document.getElementById('complete-note').value.trim();
    const completedBy = document.getElementById('complete-by').value.trim() || a.owner || currentUserName();
    logChange('Action completed', a.title);
    a.status = 'complete';
    a.completedAt = today();
    a.completedBy = completedBy;
    a.completionNote = note;
    p.lastUpdated = today();
    closeModal();
    notify('Action completed ✓');
    render();
  }, 'Complete Action');
}

function completeTask(projId, taskId) {
  const p = data.projects.find(x=>x.id===projId);
  const t = p?.tasks.find(x=>x.id===taskId);
  if (!t || t.status === 'complete') return;
  const openCount = t.actions.filter(a=>a.status!=='complete').length;
  openModal('Complete Task', `
    <div class="form-group">
      <label class="form-label">Completion Update</label>
      <textarea class="form-textarea" id="task-complete-note" placeholder="What finished, what was achieved, and what matters for later?"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Completed By</label>
      <input class="form-input" id="task-complete-by" value="${currentUserName()}" readonly style="background:#f9fafb;color:var(--text-sub)">
    </div>
    <div style="font-size:12px;color:var(--text-sub);background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 12px">Open actions still on this task: <strong>${openCount}</strong>. Completing the task will close any remaining open actions and keep them visible in completed history.</div>
  `, ()=>{
    const note = document.getElementById('task-complete-note').value.trim();
    const completedBy = document.getElementById('task-complete-by').value.trim() || t.owner || currentUserName();
    logChange('Task completed', t.title + ' on ' + p.name);
    t.status = 'complete';
    t.completedAt = today();
    t.completedBy = completedBy;
    t.completionNote = note;
    t.actions.forEach(a => {
      if (a.status !== 'complete') {
        a.status = 'complete';
        a.completedAt = today();
        a.completedBy = completedBy;
        a.completionNote = a.completionNote || `Closed when task was completed. ${note}`;
      }
    });
    p.lastUpdated = today();
    closeModal();
    notify('Task completed ✓');
    render();
  }, 'Complete Task');
}

function reopenAction(projId, taskId, actionId) {
  const p = data.projects.find(x=>x.id===projId);
  const t = p?.tasks.find(x=>x.id===taskId);
  const a = t?.actions.find(x=>x.id===actionId);
  if (!a) return;
  openModal('Reopen Action Item', `
    <div class="form-group">
      <label class="form-label">Why reopen this action</label>
      <textarea class="form-textarea" id="reopen-note" placeholder="What changed or what still needs to happen?"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Reschedule to</label>
      <input type="date" class="form-input" id="reopen-date" value="${today()}">
    </div>
  `, ()=>{
    const note = document.getElementById('reopen-note').value.trim();
    const date = document.getElementById('reopen-date').value;
    if (!note || !date) { alert('Please add a reopen note and date'); return; }
    a.status = 'pending';
    a.scheduled = date;
    a.reopenedAt = today();
    a.reopenNote = note;
    t.status = t.status === 'complete' ? 'in-progress' : t.status;
    p.lastUpdated = today();
    closeModal();
    notify('Action reopened');
    render();
  }, 'Reopen Action');
}

function reopenTask(projId, taskId) {
  const p = data.projects.find(x=>x.id===projId);
  const t = p?.tasks.find(x=>x.id===taskId);
  if (!t) return;
  openModal('Reopen Task', `
    <div class="form-group">
      <label class="form-label">Why reopen this task</label>
      <textarea class="form-textarea" id="task-reopen-note" placeholder="What is unfinished or what changed?"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">New next action</label>
      <input class="form-input" id="task-reopen-action" placeholder="Optional: create the next action now">
    </div>
    <div class="form-group">
      <label class="form-label">Action date</label>
      <input type="date" class="form-input" id="task-reopen-date" value="${today()}">
    </div>
  `, ()=>{
    const note = document.getElementById('task-reopen-note').value.trim();
    const actionTitle = document.getElementById('task-reopen-action').value.trim();
    const actionDate = document.getElementById('task-reopen-date').value;
    if (!note) { alert('Please add a reopen note'); return; }
    t.status = 'in-progress';
    t.reopenedAt = today();
    t.reopenNote = note;
    if (actionTitle) {
      t.actions.push({ id:'a'+Date.now(), type:'Follow Up', title:actionTitle, est:20, scheduled:actionDate || today(), status:'pending', owner:t.owner || currentUserName(), captures: [] });
    }
    p.lastUpdated = today();
    closeModal();
    notify('Task reopened');
    render();
  }, 'Reopen Task');
}

function deferAction(projId, taskId, actionId) {
  openModal('Defer Action Item', `
    <div class="form-group">
      <label class="form-label">Reason for Deferral</label>
      <textarea class="form-textarea" id="defer-reason" placeholder="Why is this being deferred?"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Reschedule to</label>
      <input type="date" class="form-input" id="defer-date" min="${today()}" value="${tomorrow()}">
    </div>
  `, ()=>{
    const reason = document.getElementById('defer-reason').value.trim();
    const date = document.getElementById('defer-date').value;
    if (!reason || !date) { alert('Please fill in both fields'); return; }
    const p = data.projects.find(x=>x.id===projId);
    const t = p?.tasks.find(x=>x.id===taskId);
    const a = t?.actions.find(x=>x.id===actionId);
    logChange('Action deferred', (a?a.title:'unknown') + ' → ' + date);
    if (a) { a.scheduled = date; a.deferCount = (a.deferCount||0)+1; a.deferReason = reason; }
    if (t) t.deferrals = (t.deferrals||0)+1;
    closeModal(); notify('Deferred — rescheduled'); render();
  });
}

function tomorrow() { const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().split('T')[0]; }

function toggleStep(stepId) {
  data.routines.forEach(r=>r.steps.forEach(s=>{ if(s.id===stepId){ logChange(s.done?'Routine step unchecked':'Routine step checked', s.title); s.done=!s.done; } }));
  render();
}

// ── MODALS ────────────────────────────────────────────────────────────────────
function _togglePickerLabel(el) {
  var lbl = el.closest ? el.closest('label') : el.parentElement;
  if (!lbl) return;
  lbl.style.borderColor   = el.checked ? 'var(--accent)' : 'var(--border)';
  lbl.style.background    = el.checked ? 'var(--accent-light)' : 'white';
  lbl.style.color         = el.checked ? 'var(--accent)' : 'var(--text-sub)';
  lbl.style.fontWeight    = el.checked ? '600' : '400';
}

function multiUserPicker(wrapperId, selectedEmails) {
  var users = signedInUsers();
  var sel = selectedEmails || [];
  var html = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px">';
  users.forEach(function(u) {
    var email = u.email || u.name;
    var picked = sel.indexOf(email) >= 0;
    var borderColor = picked ? 'var(--accent)' : 'var(--border)';
    var bg          = picked ? 'var(--accent-light)' : 'white';
    var color       = picked ? 'var(--accent)' : 'var(--text-sub)';
    var fw          = picked ? '600' : '400';
    html += '<label style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:7px;font-size:12px;cursor:pointer;border:1px solid ' + borderColor + ';background:' + bg + ';color:' + color + ';transition:all 0.12s;font-weight:' + fw + '">';
    html += '<input type="checkbox" style="display:none" name="' + wrapperId + '" value="' + email + '"' + (picked ? ' checked' : '') + ' onchange="_togglePickerLabel(this)">';
    html += (picked ? '✓ ' : '') + (u.name || u.email) + '</label>';
  });
  html += '</div>';
  return html;
}

function getMultiSelect(wrapperId) {
  var checked = document.querySelectorAll('input[name="' + wrapperId + '"]:checked');
  return Array.from(checked).map(function(el){ return el.value; });
}

function injectUserDropdowns() {
  ['task-owner-wrap','act2-owner-wrap','proj-owner-wrap'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = userDropdown(id.replace('-wrap',''));
  });
  // Inject multi-pickers for assignees/followers
  var apEl = document.getElementById('proj-assignees-wrap');
  var fpEl = document.getElementById('proj-followers-wrap');
  var p = currentProject;
  if (apEl) apEl.innerHTML = multiUserPicker('proj-assignees', p ? (p.assignees||[]) : []);
  if (fpEl) fpEl.innerHTML = multiUserPicker('proj-followers', p ? (p.followers||[]) : []);
}
function openModal(title, body, onConfirm, confirmLabel='Confirm') {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  setTimeout(injectUserDropdowns, 0);
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn-primary" onclick="modalConfirm()">` + confirmLabel + `</button>
  `;
  window._modalConfirm = onConfirm;
  document.getElementById('modal-overlay').classList.add('open');
}
function modalConfirm() { if (window._modalConfirm) window._modalConfirm(); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

    if (isEdit) {
      if (!ex.versions) ex.versions = [];
      ex.versions.unshift({ savedAt:new Date().toISOString(), submittedBy:ex.submittedBy, status:ex.status, whereItsUp:ex.whereItsUp, completed:ex.completed, nextAction:ex.nextAction, blocker:ex.blocker, followUp:ex.followUp });
      ex.editedAt = new Date().toISOString(); ex.status=statusVal; ex.whereItsUp=where;
      ex.completed=document.getElementById("tu-completed").value.trim();
      ex.nextAction=document.getElementById("tu-next").value.trim();
      ex.followUp=document.getElementById("tu-followup").value;
      ex.submittedBy=(document.getElementById("tu-by")?document.getElementById("tu-by").value.trim():currentUserName())||currentUserName();
      if (blocker) ex.blocker=blocker;
    } else {
      var newUpd = { id:"upd"+Date.now(), submittedAt:new Date().toISOString(), submittedBy:(document.getElementById("tu-by")?document.getElementById("tu-by").value.trim():currentUserName())||currentUserName(), status:statusVal, whereItsUp:where, completed:document.getElementById("tu-completed").value.trim(), nextAction:document.getElementById("tu-next").value.trim(), followUp:document.getElementById("tu-followup").value, blocker:blocker, versions:[] };
      if (!p.updates) p.updates=[];
      p.updates.unshift(newUpd);
      if (blocker) {
        var iTask = { id:"it"+Date.now(), title:"Issue: "+blocker.what.slice(0,50), status:"in-progress", owner:blocker.who, due:blocker.by||"", isIssue:true, linkedProjectId:p.id, actions:[], updates:[], captures:[], deferrals:0 };
        p.tasks.push(iTask); blocker.issueTaskId=iTask.id; newUpd.blocker=blocker;
        p.blocker={ active:true, what:blocker.what, who:blocker.who, by:blocker.by, issueTaskId:iTask.id };
      }
    }
    p.status=statusVal==="done"?"done":statusVal==="active"?"active":statusVal;
    p.whereItsAt=where;
    p.nextStep=document.getElementById("tu-next").value.trim()||p.nextStep;
    p.nextTouch=document.getElementById("tu-followup").value||p.nextTouch;
    p.updateCadenceDays=Number(document.getElementById("tu-cadence").value||p.updateCadenceDays||7);
    if (statusVal!=="blocked" && p.blocker) p.blocker.active=false;
    logChange(isEdit?'Update edited':'Update submitted', p.name + ' — ' + statusVal);
    p.lastUpdated=today();
    closeModal(); notify(isEdit?"Update saved":"Update added");
    if (currentProject) renderProjectDetail(); else render();
  }, isEdit?"Save Changes":"Submit Update");
}

function addInboxItem() {
  var input = document.getElementById('inbox-text');
  if (!input) return;
  var text = input.value.trim();
  if (!text) return;
  if (!data.inbox) data.inbox = [];
  data.inbox.unshift({ id:'i'+Date.now(), text: text, createdAt: new Date().toISOString() });
  input.value = '';
  closeModal();
  notify('Captured to inbox');
  renderSidebar();
}

function processInboxItem(index, type) {
  var item = (data.inbox||[])[index];
  if (!item) return;
  closeModal();
  if (type === 'project') {
    data.inbox.splice(index, 1);
    openAddProject();
  } else if (type === 'task') {
    data.inbox.splice(index, 1);
    openAddAction();
  } else {
    data.inbox.splice(index, 1);
    notify('Item noted and dismissed');
    renderSidebar();
  }
}

function dismissInboxItem(index) {
  (data.inbox||[]).splice(index, 1);
  closeModal();
  notify('Dismissed');
  renderSidebar();
  openInbox();
}


// ── HELPERS: UPDATES & ISSUES ────────────────────────────────────────────────
function allIssues() {
  var results = [];
  data.projects.forEach(function(p) {
    p.tasks.forEach(function(t) {
      if (t.isIssue && t.status !== 'complete') results.push({ task:t, project:p });
      else if (t.blocker && t.blocker.active) results.push({ task:t, project:p, isBlocker:true });
    });
  });
  return results;
}

function latestUpdate(task) {
  var u = task.updates || [];
  return u.length ? u[0] : null;
}

function derivedTaskSummary(task) {
  var u = latestUpdate(task);
  if (u && u.whereItsUp) return u.whereItsUp;
  var done = (task.actions||[]).filter(function(a){return a.status==='complete';});
  if (done.length) return done.length + ' action(s) completed. Latest: ' + done[0].title + '.';
  return 'No updates yet.';
}

function taskNextActionText(task) {
  var u = latestUpdate(task);
  if (u && u.nextAction) return u.nextAction;
  var a = (task.actions||[]).find(function(a){return a.status==='pending';});
  return a ? a.title + ' (' + fmtDate(a.scheduled) + ')' : '';
}

function backToProject() {
  currentTask = null;
  renderProjectDetail();
}

function renderTaskDetail() {
  var t = currentTask;
  var p = currentProject;
  if (!t || !p) return;
  document.getElementById('topbar-title').textContent = t.title;
  document.getElementById('topbar-sub').textContent = p.name + ' \u00b7 ' + ((getWS(p.ws)||{}).name||'');

  });

  var nextA = (t.actions||[]).find(function(a){return a.status==='pending';});
  var blocker = t.blocker && t.blocker.active ? t.blocker : null;

  var html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">';
  html += '<button class="back-btn" style="margin-bottom:0" onclick="backToProject()">\u2190 Back to ' + p.name + '</button>';

  html += '<div class="detail-header" style="margin-bottom:16px">';

  html += '<span class="' + statusTag(t.status) + '">' + statusLabel(t.status) + '</span>';
  html += '<span class="tag tag-gray">\ud83d\udc64 ' + (t.owner||'Unassigned') + '</span>';
  if (t.due) html += '<span class="tag ' + (isPast(t.due)&&t.status!=='complete'?'tag-red':'tag-gray') + '">Due ' + fmtDate(t.due) + '</span>';
  if (t.isIssue) html += '<span class="tag tag-red">\u26a0 Issue Task</span>';
  if (t.linkedTaskId) {
    var linked = p.tasks.find(function(lt){return lt.id===t.linkedTaskId;});
    if (linked) html += '<span class="tag tag-amber" style="cursor:pointer" onclick="openTask(\'' + p.id + '\',\'' + linked.id + '\')">\ud83d\udd17 Linked: ' + linked.title + '</span>';
  }
  html += '</div></div>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0">';
  if (t.status !== 'complete') {
    html += '<button onclick="openEditTask(\'' + p.id + '\',\'' + t.id + '\')" class="btn-ghost">\u270f\ufe0f Edit</button>';
    html += '<button onclick="openAddActionForTask(\'' + p.id + '\',\'' + t.id + '\')" class="btn-ghost">+ Action</button>';
    html += '<button onclick="openTaskUpdateForm(\'' + p.id + '\',\'' + t.id + '\')" class="btn-primary">+ Update</button>';
  } else {

  }
  html += '</div></div>';

  // Blocker
  if (blocker) {
    var issueTask = blocker.issueTaskId ? p.tasks.find(function(it){return it.id===blocker.issueTaskId;}) : null;
    html += '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 14px;margin-top:14px">';
    html += '<div style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">\u26a0\ufe0f Blocked</div>';

    html += '</div>';
  }
